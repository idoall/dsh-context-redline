<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上下文批改台 · 交互原型（demo）</title>
<link rel="icon" href="data:," />
<style>
/* ============================================================================
 * 上下文批改台 · 交互原型样式
 * 规则（docs/03 §6）：颜色一律走"主题令牌"，深浅两套自动跟随；不写死十六进制。
 *
 * 移动端适配（参照参考插件 dsh-context 的做法：**设计进去，不是断点堆出来**）：
 *   · 主布局用 flex-wrap 流式列（`flex: 1 1 min(420px, 100%)`）→ 窄屏自动单列，**不需要 @media**
 *   · 卡片内部用 **@container 容器查询**（卡片自身 `container-type: inline-size`）
 *   · 横向滚动条统一 `overscroll-behavior-x: contain`（左右滑到头不再触发浏览器返回/前进）
 *     ＋ demo.js 里的 containHorizontalOverscroll（WebKit 会忽略该属性，只能靠取消 wheel 兜住）
 *   · `pointer: coarse`（真触屏）才放大到 44px 触控目标 —— 桌面窄窗口不算触屏
 *   · 安全区：env(safe-area-inset-*) 让底部按钮不被 iPhone 手势条盖住
 * ==========================================================================*/

:root {
  --dsw-alias-bg-layer-1: #ffffff;
  --dsw-alias-bg-layer-2: #ffffff;
  --dsw-alias-bg-layer-3: #f4f4f5;
  --dsw-alias-label-primary: #18181b;
  --dsw-alias-label-secondary: #52525b;
  --dsw-alias-label-caption: #8b8b93;
  --dsw-alias-border-l1: #e4e4e7;
  --dsw-alias-border-l2: #d4d4d8;
  --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .05);
  --dsw-alias-brand: #4f46e5;
  --ds-color-green: #16a34a;
  --ds-color-teal: #0d9488;
  --ds-color-purple: #7c3aed;
  --ds-color-orange: #ea580c;
  --ds-color-blue: #2563eb;
  --ds-color-amber: #d97706;
  --ds-color-red: #dc2626;
  --ds-color-indigo: #4f46e5;
  --ds-shadow: 0 8px 24px rgba(0, 0, 0, .10);
  --ds-radius: 10px;
  --ds-touch: 30px;
  --dsh-scrollbar-width: 8px;
}

html[data-theme="dark"] {
  --dsw-alias-bg-layer-1: #232324;
  --dsw-alias-bg-layer-2: #2c2c2e;
  --dsw-alias-bg-layer-3: #1b1b1c;
  --dsw-alias-label-primary: #f4f4f5;
  --dsw-alias-label-secondary: #b9b9c0;
  --dsw-alias-label-caption: #8b8b93;
  --dsw-alias-border-l1: #3a3a3d;
  --dsw-alias-border-l2: #4a4a4e;
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .07);
  --dsw-alias-brand: #8b8bf5;
  --ds-color-green: #4ade80;
  --ds-color-teal: #2dd4bf;
  --ds-color-purple: #c084fc;
  --ds-color-orange: #fb923c;
  --ds-color-blue: #60a5fa;
  --ds-color-amber: #fbbf24;
  --ds-color-red: #f87171;
  --ds-color-indigo: #a5b4fc;
  --ds-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
/* ⚠️ 必须显式声明：下面 .modal-wrap/.drawer 用了 display:flex，会盖掉 UA 对 [hidden] 的 display:none */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--dsw-alias-bg-layer-3);
  color: var(--dsw-alias-label-primary);
  font: 14px/22px -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;               /* 页面本身绝不横向滚：横向滚动只发生在卡片内部的滚动条里 */
}

/* ---------- 顶栏 + 状态开关（窄屏自动换行，不横向溢出） ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: var(--dsw-alias-bg-layer-1);
  border-bottom: 1px solid var(--dsw-alias-border-l1);
}
.brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand .tag { font-size: 12px; color: var(--dsw-alias-label-caption); border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; padding: 1px 8px; }
.brand .link { color: var(--dsw-alias-brand); text-decoration: none; font-size: 12px; }
.switches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.sw {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; color: var(--dsw-alias-label-secondary);
  background: transparent; cursor: pointer; min-height: var(--ds-touch); white-space: nowrap;
}
.sw[aria-pressed="true"] { border-color: var(--dsw-alias-brand); color: var(--dsw-alias-label-primary); }
.sw i { width: 8px; height: 8px; border-radius: 999px; background: var(--dsw-alias-label-caption); }
.sw[aria-pressed="true"] i { background: var(--ds-color-green); }

.btn {
  min-height: var(--ds-touch); padding: 5px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary); font-size: 12px;
}
.btn:hover { background: var(--dsw-alias-interactive-bg-hover); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--ds-color-red); color: var(--ds-color-red); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 26px; padding: 2px 8px; font-size: 12px; }

/* 分段开关（按轮次/按步骤 · 总计/增量 · 自适应）：参照参考插件的 .lc-seg */
.seg {
  min-height: var(--ds-touch); padding: 3px 9px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--dsw-alias-border-l2); background: transparent;
  color: var(--dsw-alias-label-secondary); border-radius: 7px; white-space: nowrap;
}
.seg + .seg { margin-left: -1px; }
.seg:first-of-type { border-radius: 7px 0 0 7px; }
.seg[aria-pressed="true"] { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); border-color: var(--dsw-alias-brand); font-weight: 600; }
.seg:disabled { opacity: .45; cursor: not-allowed; }
.segsep { width: 8px; }

/* ---------- 说明条 ---------- */
.noticebar {
  margin: 12px 14px 0; padding: 8px 12px; border-radius: var(--ds-radius);
  background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1);
  color: var(--dsw-alias-label-secondary); display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}

/* ---------- 主布局：**流式列**（无 @media：窄屏自动单列） ---------- */
.cols { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 14px; align-items: flex-start; }
.col { flex: 1 1 min(420px, 100%); min-width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1);
  border-radius: var(--ds-radius); padding: 10px 12px; min-width: 0;
  container-type: inline-size;         /* ← 卡片内部用容器查询自适应（参照参考插件的 @container 写法） */
}
.card-title {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;
  font-weight: 600; font-size: 13px; color: var(--dsw-alias-label-primary);
}
.card-title .hint { font-weight: 400; font-size: 12px; color: var(--dsw-alias-label-caption); }

/* ---------- 状态数字卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 8px; }
.stat { border: 1px solid var(--dsw-alias-border-l1); border-radius: 8px; padding: 8px; min-width: 0; }
.stat b { display: block; font-size: 18px; line-height: 24px; }
.stat span { font-size: 12px; color: var(--dsw-alias-label-caption); }

/* ---------- 趋势图（参照参考插件 trendChart：固定柱宽 + 横向滚动 + 吸附边界的 overscroll） ---------- */
.trendwrap { display: flex; gap: 6px; align-items: stretch; }
.axis { position: relative; width: 40px; height: 150px; padding-top: 18px; color: var(--dsw-alias-label-secondary); font-size: 11px; flex: none; }
.axis span { position: absolute; right: 0; line-height: 1; }
.axis span:nth-child(1) { top: 13px; }
.axis span:nth-child(2) { top: 69px; }
.axis span:nth-child(3) { top: 125px; }
/* 定位上下文：tooltip 必须挂在**滚动容器外面**——放里面会撑大 scrollWidth，
   让横向滚动条在每次 hover 时开合、整张卡片跟着跳（参考插件原话）。 */
.trendpos { position: relative; flex: 1; min-width: 0; }
.chart-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 6;
  display: flex; flex-direction: column; gap: 2px;
  max-width: 100%; box-sizing: border-box; overflow-wrap: anywhere;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 6px; padding: 4px 9px; font-size: 12px; line-height: 17px;
  color: var(--dsw-alias-label-primary); box-shadow: 0 2px 8px rgba(0,0,0,.18);
  pointer-events: none;                     /* 不许挡住下面的柱子，否则 hover 会闪 */
}
.chart-tip span + span { color: var(--dsw-alias-label-secondary); }
.chart-tip .tipmark { color: var(--ds-color-amber); }
.trendscroll {
  flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain;              /* 滑到头不链到浏览器的返回/前进 */
  scrollbar-gutter: stable;                    /* 有无滚动条都不跳版 */
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  padding-bottom: var(--dsh-scrollbar-width, 8px);
}
.trendinner { width: max-content; min-width: 100%; }
.markers { position: relative; height: 14px; }
.mark { position: absolute; top: 0; font-size: 11px; color: var(--ds-color-amber); text-align: center; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 112px; }
.tbar {
  flex: none; padding: 0; border: 0; border-radius: 2px 2px 0 0; cursor: pointer;
  background: linear-gradient(to top, var(--dsw-alias-brand), color-mix(in srgb, var(--dsw-alias-brand) 55%, transparent));
  outline: 1px dashed transparent; outline-offset: 1px;
}
.tbar.neg { background: linear-gradient(to bottom, var(--ds-color-red), color-mix(in srgb, var(--ds-color-red) 55%, transparent)); }
.tbar:hover { outline-color: var(--dsw-alias-brand); }
.tbar.sel { outline: 2px solid var(--dsw-alias-label-primary); }
.strip { display: flex; align-items: stretch; gap: 3px; margin-top: 2px; }
.tcell {
  flex: none; height: 22px; padding: 0; cursor: pointer; overflow: hidden; white-space: nowrap;
  border: 1px solid var(--dsw-alias-border-l1); border-radius: 4px; font-size: 11px;
  background: transparent; color: var(--dsw-alias-label-caption);
}
.tcell:hover { background: var(--dsw-alias-interactive-bg-hover); }

/* 步级快捷片 */
.stepchips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chipstep {
  min-height: var(--ds-touch); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--dsw-alias-border-l2); background: transparent; color: var(--dsw-alias-label-secondary);
}
.chipstep.sel { border-color: var(--dsw-alias-brand); color: var(--dsw-alias-label-primary); font-weight: 600; }
.chipstep.live { border-style: dashed; }

/* ---------- 分类树 ---------- */
.catrow {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; border-radius: 8px; padding: 6px 8px;
  color: var(--dsw-alias-label-primary); cursor: pointer; min-height: var(--ds-touch);
}
.catrow:hover { background: var(--dsw-alias-interactive-bg-hover); }
.catrow .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); opacity: .6; flex: none; }
.catrow[aria-expanded="true"] .chev { transform: rotate(45deg); }
.catrow .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; cursor: pointer; }
.catrow .swatch.focused { box-shadow: 0 0 0 2px var(--dsw-alias-label-primary); }
.catrow .label { flex: 0 1 auto; }
.catrow .grow { flex: 1 1 auto; }
.catrow .count, .catrow .tokens, .catrow .pct { font-size: 12px; color: var(--dsw-alias-label-caption); margin-left: 6px; white-space: nowrap; }
.catbody { padding: 2px 0 6px 20px; }
.catsq { width: 12px; height: 12px; border-radius: 3px; flex: none; cursor: pointer; }

/* ---------- 元素行 ---------- */
.row { border-top: 1px dashed var(--dsw-alias-border-l1); }
.row:first-child { border-top: 0; }
.row-main {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; padding: 5px 6px; color: var(--dsw-alias-label-primary);
  cursor: pointer; min-height: var(--ds-touch);
}
.row-main:hover { background: var(--dsw-alias-interactive-bg-hover); border-radius: 6px; }
.row-main .tagchip { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-secondary); white-space: nowrap; }
.row-main .preview { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dsw-alias-label-secondary); }
.row-main .tok { font-size: 11px; color: var(--dsw-alias-label-caption); white-space: nowrap; }
.row-body { padding: 6px 8px 10px 22px; color: var(--dsw-alias-label-secondary); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.row-body .meta { color: var(--dsw-alias-label-caption); font-size: 12px; margin-bottom: 4px; }
.row.shadowed { opacity: .55; }
.row.shadowed .preview { text-decoration: line-through; }

/* ---------- 动作条 ---------- */
.actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 6px 6px 22px; }
.seq { font-size: 11px; color: var(--dsw-alias-label-caption); border: 1px solid var(--dsw-alias-border-l1); border-radius: 999px; padding: 0 6px; }
.chip-soft { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px dashed var(--dsw-alias-border-l2); color: var(--dsw-alias-label-caption); }
.chip-draft { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-amber); color: var(--ds-color-amber); }
.chip-shadow { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-caption); }
.chain { font-size: 12px; color: var(--dsw-alias-label-secondary); }

/* ---------- 内联编辑器 ---------- */
.editor { margin: 0 6px 10px 22px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 8px; padding: 8px; background: var(--dsw-alias-bg-layer-2); }
.editor .etitle { font-size: 12px; font-weight: 600; margin: 0 0 2px; }
.editor .enote { font-size: 12px; color: var(--dsw-alias-label-secondary); margin: 0 0 8px; }
.field { display: block; margin-bottom: 8px; }
.field span { display: block; font-size: 12px; color: var(--dsw-alias-label-caption); margin-bottom: 3px; }
.field textarea, .field input, .modal input {
  width: 100%; background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary);
  border: 1px solid var(--dsw-alias-border-l2); border-radius: 6px; padding: 6px; font: inherit; resize: vertical;
}
.efoot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.eblocked { color: var(--ds-color-amber); font-size: 12px; margin: 4px 0; }
.emsg-err { color: var(--ds-color-red); font-size: 12px; margin: 4px 0; }
.emsg-ok { color: var(--ds-color-green); font-size: 12px; margin: 4px 0; }

/* ---------- 版本历史 ---------- */
.history { margin: 0 6px 10px 22px; border: 1px dashed var(--dsw-alias-border-l2); border-radius: 8px; padding: 8px; }
.vrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
.vrow .vlabel { font-size: 12px; color: var(--dsw-alias-label-primary); min-width: 150px; }
.vrow .vtext { flex: 1 1 200px; min-width: 0; font-size: 12px; color: var(--dsw-alias-label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .vwhy { font-size: 11px; color: var(--dsw-alias-label-caption); }

/* ---------- 快照与子会话 ---------- */
.snap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-top: 1px dashed var(--dsw-alias-border-l1); }
.snap:first-child { border-top: 0; }
.snap .snapid { font-family: ui-monospace, monospace; font-size: 12px; }
.badge-src-own { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-teal); color: var(--ds-color-teal); }
.badge-src-team { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-purple); color: var(--ds-color-purple); }
.badge-state { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-secondary); }
.cap { font-size: 12px; color: var(--dsw-alias-label-caption); overflow-wrap: anywhere; }

/* ---------- 官方团队区块（只读） ---------- */
.subhead { font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--dsw-alias-label-secondary); }
.task, .member { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; flex-wrap: wrap; }
.task .tstat, .member .mstat { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.s-idle { background: var(--dsw-alias-label-caption); }
.s-run { background: var(--ds-color-amber); }
.s-block { background: var(--ds-color-orange); }
.s-done { background: var(--ds-color-green); }
.s-fail { background: var(--ds-color-red); }
.muted { color: var(--dsw-alias-label-caption); }

/* ---------- 吸顶未生效 ---------- */
.sticky-drafts {
  position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 30;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: var(--ds-radius);
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--ds-color-amber);
}

/* ---------- 抽屉 / 弹窗 / 回执 ---------- */
/* 讲解面板：像 DSH 右侧栏一样**推**出来 —— 内容被挤窄，而不是被盖住。
 * 做法：面板还是 fixed 贴右边，但打开时给 body 加 padding-right（腾出同宽的空间），
 * 于是所有内容重新排版到左侧、右侧不再被遮住，也就不用"先关掉才能看"。
 * 窄屏放不下 420px 的推挤 → 回退成遮罩式（真侧栏在手机上也这么做）。 */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 60;
  background: var(--dsw-alias-bg-layer-2); border-left: 1px solid var(--dsw-alias-border-l2);
  box-shadow: var(--ds-shadow); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: drawer-in .16s ease-out;
}
@keyframes drawer-in { from { transform: translateX(12px); opacity: .6; } to { transform: none; opacity: 1; } }
body.drawer-open { padding-right: min(420px, 100vw); }
body { transition: padding-right .18s ease-out; }
/* 窄屏/手机：推不开（一共才那么点宽）→ 退回遮罩式，这时才需要"点外面关掉" */
@media (max-width: 899px) {
  body.drawer-open { padding-right: 0; }
  body.drawer-open::before { content: ''; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.35); }
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
.drawer-body { padding: 10px 12px; overflow: auto; -webkit-overflow-scrolling: touch; }
.kv { margin-bottom: 8px; }
.kv b { display: block; font-size: 12px; color: var(--dsw-alias-label-caption); font-weight: 500; }
.kv div { font-size: 13px; overflow-wrap: anywhere; }
.modal-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal { width: min(560px, 100%); max-height: min(86vh, 86dvh); background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2); border-radius: var(--ds-radius); box-shadow: var(--ds-shadow); display: flex; flex-direction: column; }
.modal-head { padding: 10px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
.modal-body { padding: 10px 12px; overflow: auto; -webkit-overflow-scrolling: touch; }

.toast.err { border-color: var(--ds-color-red); color: var(--ds-color-red); }

/* ---------- 自测面板 ---------- */
.selfcheck {
  position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  width: min(460px, calc(100vw - 24px)); max-height: 46vh; overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2);
  border-radius: var(--ds-radius); box-shadow: var(--ds-shadow); padding: 10px 12px; font-size: 12px;
}
.selfcheck h4 { margin: 8px 0 4px; font-size: 12px; color: var(--dsw-alias-label-secondary); }
.selfcheck .ok { color: var(--ds-color-green); }
.selfcheck .bad { color: var(--ds-color-red); }

/* ---------- 讲解模式 ---------- */
body.explain [data-explain] { outline: 1px dashed var(--dsw-alias-brand); outline-offset: 1px; position: relative; }
/* 序号是**真实节点**（伪元素点不到）：只有点它才出讲解，点按钮本身照常交互 */
.exnum {
  position: absolute; top: -9px; left: -8px; z-index: 7;
  min-width: 16px; padding: 0 4px; text-align: center; cursor: help; user-select: none;
  background: var(--dsw-alias-brand); color: #fff; font-size: 10px; line-height: 15px;

.exnum-in { top: 1px; left: 1px; }
body.explain .trendscroll .tbar { min-height: 17px; }
.explainbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 55;
  width: min(92vw, 620px); text-align: center;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-brand);
  border-radius: 999px; padding: 6px 14px; font-size: 12px; box-shadow: var(--ds-shadow);
}

/* ============================================================================
 * 卡片内部自适应：容器查询（不是 @media）—— 卡片被挤窄时自己改排布
 * ==========================================================================*/
@container (max-width: 520px) {
  .trendwrap { flex-direction: column; }
  .axis { display: none; }                          /* 太窄时不画纵轴，省出横向空间 */
  .card-title .hint { display: none; }
}
@container (max-width: 360px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row-main .tagchip { display: none; }              /* 极窄时只留正文预览与 token */
}

/* ============================================================================
 * 真触屏（pointer: coarse）：把可点区域放大到 ≥44px —— 桌面窄窗口不算触屏
 * ==========================================================================*/
@media (pointer: coarse) {
  :root { --ds-touch: 44px; }

  .tbar { min-height: 2px; }                         /* 柱子本身保持数据高度，靠外层点击区放大 */
  .actions { gap: 8px; }
  .field textarea, .field input, .modal input { min-height: 44px; }
  .trendscroll { padding-bottom: 14px; }
}

/* ------------------------------------------------------------------ 2. 演示数据 */

/** 早期轮次：按 turn 生成「步数 / 条数都不同」的请求，用来看 28 轮时的效果 */
function buildEarly() {
  const nodes = [], reqs = [];
  for (let turn = 1; turn < TOTAL_TURNS; turn++) {
    let s = 100 + (turn - 1) * 40;
    const steps = 1 + (turn % 4);                    // 1–4 步
    const nUser = 1 + (turn % 2);                    // 1–2 条用户消息
    const nTool = turn % 4;                          // 0–3 条工具结果
    const skill = turn % 3 === 0;
    const userSeqs = [];
    for (let i = 0; i < nUser; i++) {
      userSeqs.push(++s);
      nodes.push(N(s, 'user', 'user/message', `第 ${turn} 轮 · 用户消息 ${i + 1}：${USER_TEXTS[(turn + i) % USER_TEXTS.length]}`, 42 + ((turn * 7 + i * 13) % 90)));
    }
    const asst = ++s;
    nodes.push(N(asst, 'assistant', 'assistant/message', `第 ${turn} 轮的助手回复：先看代码再动手，附带必要说明。（第 ${turn} 轮）`, 180 + ((turn * 17) % 260)));
    const toolSeqs = [];
    for (let i = 0; i < nTool; i++) {
      toolSeqs.push(++s);
      nodes.push(N(s, 'tool', 'tool/result', `第 ${turn} 轮 · 工具结果 ${i + 1}：${'output line\n'.repeat(1 + ((turn + i) % 3))}`, 70 + ((turn * 11 + i * 29) % 180)));
    }
    let skillSeq = null;
    if (skill) { skillSeq = ++s; nodes.push(N(skillSeq, 'skill', 'user/message', '[skill-catalog] 可用技能：agent-experience / browser-skill / cordis-plugin-development …', 900, { name: 'skill-catalog' })); }
    for (let k = 1; k <= steps; k++) {
      const reqSeq = ++s;
      const surface = [1, 2, 3, ...userSeqs];
      if (k >= 1) surface.push(asst);
      for (let i = 0; i < Math.min(k - 1, toolSeqs.length); i++) surface.push(toolSeqs[i]);
      if (skillSeq) surface.push(skillSeq);
      reqs.push({ seq: reqSeq, turn, step: k, time: `${10 + Math.floor(turn / 6)}:${String((turn * 3 + k) % 60).padStart(2, '0')}`, surface, gone: {} });
    }
  }
  return { nodes, reqs };
}

/** ✂ 压缩 / 剪枝（prune）事件。语义照参考插件的 attachMarkers：
 *  **每个事件只标在「它之后的第一个请求」那一根柱子上**（一个事件 = 一根柱，绝不重复标）。 */
const EVENTS = [

/** 该事件之后出现的第一个请求 */
function firstReqAtOrAfter(seq) {
  const r = REQUESTS.find((x) => x.seq >= seq);
  return r ? r.seq : null;
}
/** 这一根柱子（按步骤模式）上挂着的事件；正常 0 或 1 条 */
function markersOfReq(req) {
  return EVENTS.filter((ev) => firstReqAtOrAfter(ev.seq) === req.seq);
}
/** 这一根柱子（两种粒度通用）上挂着的事件：
 *  按轮次时该轮各步的标记会合并（因为一轮只有一根柱，不能把事件吞掉）。 */
function markersOfBar(item) {
  if (S.trendGran !== 'turn') return markersOfReq(item);
  const seen = new Set();
  return reqsOfTurn(item.turn).flatMap((r) => markersOfReq(r)).filter((ev) => (seen.has(ev.seq) ? false : seen.add(ev.seq)));
}

/** 兜住 WebKit 忽略 overscroll-behavior-x 的情况（参照参考插件 overscroll.ts）：
 *  横向滑到头时取消这次 wheel，否则会触发浏览器的"左滑返回/右滑前进"，整个页面被带出去。 */
function containHorizontalOverscroll(el) {
  if (!el) return;
  el.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    const atStart = e.deltaX < 0 && el.scrollLeft <= 0;
    const atEnd = e.deltaX > 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
    if (atStart || atEnd) e.preventDefault();
  }, { passive: false });
}

/* ---------- 5.1 上下文趋势（按轮次 / 按步骤 · 总计 / 增量 · 自适应 · 聚焦 · ✂） ---------- */
const BAR_W = 14, BAR_GAP = 3, CHART_H = 112;

function trendItems() {
  const list = S.trendGran === 'turn'
    ? (() => {                                   // aggregateByTurn：一轮 = 该轮**末步**的请求，带 stepCount
        const out = [];
        for (const r of REQUESTS) {
          const last = out[out.length - 1];
          if (last && last.turn === r.turn) out[out.length - 1] = { ...r, stepCount: (last.stepCount || 1) + 1 };
          else out.push({ ...r, stepCount: 1 });
        }
        return out;
      })()
    : REQUESTS;
  const vals = list.map((r) => metricOf(r, S.trendCat));
  const series = S.trendMode === 'delta'
    ? vals.map((v, i) => (i === 0 ? v : v - vals[i - 1]))
    : vals;
  return { list, series };
}
function visibleMax(series, scrollEl) {
  if (!S.trendAdaptive || !scrollEl) return Math.max(1, ...series.map((v) => Math.abs(v)));
  const bw = BAR_W + BAR_GAP;
  const i0 = Math.max(0, Math.floor(scrollEl.scrollLeft / bw) - 1);
  const i1 = Math.min(series.length - 1, Math.ceil((scrollEl.scrollLeft + scrollEl.clientWidth) / bw) + 1);
  let m = 1;
  for (let i = i0; i <= i1; i++) m = Math.max(m, Math.abs(series[i] || 0));
  return m;
}
function applyTrendScale() {
  const sc = $('trendScroll');
  if (!sc) return;
  const series = (window.__trendSeries || []);
  const max = visibleMax(series, sc);
  const prevMax = sc.dataset.max;              // 用于判断"刻度上限有没有变"（变了才刷自测面板）
  const top = $('trendAxisTop'), mid = $('trendAxisMid');
  if (top) top.textContent = fmt(max);
  if (mid) mid.textContent = fmt(max / 2);
  sc.querySelectorAll('.tbar').forEach((el, i) => {
    const v = series[i] || 0;
    const h = Math.max(2, Math.round((Math.abs(v) / max) * CHART_H));
    el.style.height = h + 'px';
    el.classList.toggle('neg', v < 0);
  });
  sc.dataset.max = String(max);
  /* 刻度上限也是自测面板上的一个读数。面板已经开着时，这里要把它刷新掉 ——
   * 否则面板会一直留着"这个节点刚被重建、还没算过刻度"的那一帧（实测显示 undefined）。 */
  if (prevMax !== sc.dataset.max && S.selfcheck) renderSelfcheck();
}
/* ---------- 趋势图的 hover 提示（照参考插件的 2 行式自绘 tooltip）----------
 * 文案照抄参考插件 i18n：
 *   按步骤：第 {t} 轮 · 第 {s} 步 (共 {n} 步) ／ 按轮次：第 {t} 轮 · 共 {n} 步
 *   第二行：合计 ≈ {n} ／ {类} ≈ {n}（聚焦时）／ Δ {n}（增量模式）
 * 关键：tip 挂在**滚动容器外面**，用 transform 夹在可视区内；pointer-events:none。 */
function trendTipRows(req, i, series) {
  const n = turnSteps(req.turn);
  const head = S.trendGran === 'turn'
    ? (n > 1 ? `第 ${req.turn} 轮 · 共 ${n} 步` : `第 ${req.turn} 轮 · 共 1 步`)
    : `第 ${req.turn} 轮 · 第 ${req.step} 步 (共 ${n} 步)`;
  const v = series[i] || 0;
  const metric = S.trendMode === 'delta'
    ? `Δ ${v > 0 ? '+' : ''}${fmt(v)}`
    : (S.trendCat ? `${catLabel(S.trendCat)} ≈ ${fmt(Math.abs(v))}` : `合计 ≈ ${fmt(Math.abs(v))}`);
  const rows = [head, metric];

  $('cardBrowser').querySelectorAll('[data-focus]').forEach((b) => {

  });
  $('cardBrowser').querySelectorAll('[data-elem]').forEach((b) => { b.onclick = (e) => { if (e.target.dataset.focus) return; S.openElem = S.openElem === Number(b.dataset.elem) ? null : Number(b.dataset.elem); render(); }; });

/* ------------------------------------------------------------------ 8. 动作 */
function rowAct(btn) {
  const act = btn.dataset.act;
  S.editorError = null; S.editorOk = null;
  if (act === 'esubmit') return submitEditor();
  if (act === 'ecancel') { S.editor = null; render(); return; }
  const seq = Number(btn.dataset.seq), node = nodeOf(seq);
  if (!node) return;

  if (act === 'edit') { S.editor = { kind: 'edit', seq, text: node.text, reasoning: '' }; S.historyFor = null; render(); toast(`打开 #${seq} 的内联编辑器（预填的是全文，不是 80 字预览）`); }
  if (act === 'annotate') { S.editor = { kind: 'annotate', seq, reason: '', voidFrom: String(seq), voidTo: String(seq) }; S.historyFor = null; render(); }
  if (act === 'pin') { S.editor = { kind: 'pin', seq, label: '', text: node.text }; S.historyFor = null; render(); }
  if (act === 'history') { S.historyFor = S.historyFor === seq ? null : seq; S.editor = null; render(); }

  if (act === 'apply') {
    const d = draftOf(seq);
    confirmModal({
      title: '应用到会话',
      warn: '会向会话追加一条替换记录，之后无法删除；原文对模型永久不可见，但仍保留在日志里。当前可见的那一条之后还能继续改，也能从版本历史里恢复某一版。',
      rows: [['目标', `#${seq}（当前可见节点）`], ['原文', (node.text || '').slice(0, 120)], ['改后', (d.text || '').slice(0, 120)], ['理由', d.reason || '（未填）']],
      needReason: false, okText: '确认应用',
      onOk: () => doApply(seq)
    });
  }
  if (act === 'restore') {
    const to = Number(btn.dataset.to), v = versionsOf(node).find((x) => x.seq === to) || { text: '' };
    confirmModal({
      title: '回滚到某一版',
      warn: '会向会话追加一条替换记录，把模型看到的内容恢复成你选的那一版。原文与中间版本都还在日志里，之后还可以再改。',
      rows: [['当前可见', `#${seq}`], ['要恢复到的版本', `#${to}`], ['该版正文', (v.text || '').slice(0, 140)], ['理由', `（回滚到 #${to}）`]],
      needReason: false, okText: '确认恢复',
      onOk: (reason) => {
        const ns = 1400 + S.applied.length;
        S.applied.push({ replacedSeq: seq, newSeq: ns, requestSeq: reqOf().seq, text: v.text, reason: reason || `回滚到 #${to}`, time: '12:1' + (S.applied.length % 9) });
        S.extraNodes.push(N(ns, node.cat, node.type, v.text, node.tokens, { name: node.name, requestSeq: reqOf().seq }));
        delete S.drafts[seq];
        render(); toast(`已回滚：#${seq} → 恢复为 #${to} 的内容（关系链见行上）`);
      }
    });
  }
}
function submitEditor() {
  const st = S.editor; if (!st) return;
  const node = nodeOf(st.seq);
  if (st.kind === 'edit') {
    const text = ($('edT') && $('edT').value) || '', reasoning = ($('edR') && $('edR').value) || '';
    if (text === '' && reasoning === '') { S.editorError = '可见文本与思考文本不能同时为空'; render(); return; }
    if (text === node.text && reasoning === '') { S.editorError = '没有实质改动 —— 宿主会拒绝这样的提交（no-change）'; render(); return; }
    S.drafts[st.seq] = { seq: st.seq, text, reasoning, updatedAt: '12:1x', requestSeq: reqOf().seq };
    S.editor = null; render(); toast('已保存草稿（模型还看不到）→ 行上出现「未生效」，点「应用到会话」才生效'); return;
  }
  if (st.kind === 'annotate') {
    const reason = ($('edWhy') && $('edWhy').value.trim()) || '';
    const from = Number(($('edFrom') && $('edFrom').value) || ''), to = Number(($('edTo') && $('edTo').value) || '');
    if (reason === '') { S.editorError = '理由不能为空'; render(); return; }
    if (!Number.isSafeInteger(from) || !Number.isSafeInteger(to) || from > to) { S.editorError = '作废范围要两端都给、且起点 ≤ 终点（bad-range）'; render(); return; }
    const ns = 1500 + S.extraNodes.length;
    const text = `[redline] 更正目标 seq=${st.seq}\n作废范围 seq=${from}..${to}\n理由：${reason}`;
    S.extraNodes.push(N(ns, 'inject', 'user/message', text, 60, { requestSeq: reqOf().seq, name: '批注' }));
    const r = reqOf(); if (!r.surface.includes(ns)) r.surface.push(ns);
    S.editor = null; render(); toast(`已追加更正 #${ns}（不可撤销）；原文 #${st.seq} 仍在模型可见内容里`); return;
  }
  if (st.kind === 'pin') {
    const label = (($('edLabel') && $('edLabel').value.trim()) || '目标'), text = ($('edPin') && $('edPin').value) || '';
    if (text.trim() === '') { S.editorError = '固定块正文不能为空'; render(); return; }
    S.invariants.push({ label, text, version: (S.invariants.filter((x) => x.label === label).length + 1) });
    S.editor = null; render(); toast(`已存为固定块「${label}」（逐字，插件不改一个字）；换会话仍可见 → 每轮逐字比对即可发现漂移`);
  }
}
function doApply(seq) {
  const d = draftOf(seq), node = nodeOf(seq), ns = 1300 + S.applied.length;
  S.applied.push({ replacedSeq: seq, newSeq: ns, requestSeq: reqOf().seq, text: d.text, reason: d.reason || '', time: '12:1' + (S.applied.length % 9) });
  S.extraNodes.push(N(ns, node.cat, node.type, d.text, node.tokens, { name: node.name, requestSeq: reqOf().seq }));
  delete S.drafts[seq];
  render(); toast(`已应用：#${seq} 被遮蔽 → 新条目 #${ns}（原文仍在日志里；可用版本历史恢复）`);
}
function orchAct(b) {
  const act = b.dataset.act, i = Number(b.dataset.i);
  if (act === 'freeze') {
    const note = ($('snapNote') && $('snapNote').value.trim()) || '';
    const id = 'snap-20260930-' + String(120000 + S.snapshots.length * 137).slice(0, 6);
    S.snapshots.push({ id, turn: reqOf().turn, items: surfaceOf().length, time: '12:1' + (S.snapshots.length % 9), note });
    render(); toast('已冻结（只写插件本地：切点 / 条目数 / 时间 / 人写备注 / 固定块版本 —— 不写会话）'); return;
  }
  if (act === 'spawn') {
    confirmModal({
      title: '允许创建子会话',
      warn: '会用这个会话「已完成的轮次」做种子新建一个子会话（种子是一次性的：之后本会话的新轮次不会进去）。',
      rows: [['① 种子范围', `第 ${reqOf().turn} 轮末（cutSeq = 最后一个 turn/end）`],
             ['② 首条任务', '（见下方理由栏 —— 必须由你写）'],
             ['③ 继承范围', '✅ 继承：已完成的对话历史（含你已应用的编辑）｜❌ 不继承：父会话的工具授权/权限；父会话也不会自动收到子会话的 transcript / 工具输出 / 思考'],
             ['④ 副作用', S.sw.team ? '走官方 spawnTeammate(context:"fork") → 进官方名册（任务板/成员导航/派活都有）' : '团队不可用 → 退化为"裸可续接子会话"（没有任务板与官方派活）'],
             ['⑤ 取消', '取消 = 什么都不发生（不建会话、不写日志）']],
      needReason: true, okText: '确认创建',
      onOk: (reason) => {
        const id = '00' + (49000 + S.children.length * 771).toString(16).slice(0, 6);
        S.children.push({ id, src: 'own', state: 'running', label: reason.slice(0, 24), from: S.snapshots.length ? S.snapshots[S.snapshots.length - 1].id : 'snap-（当前）' });
        render(); toast(`已创建 ${id}（看索引行；来源徽章 = 本项目发起）`);
      }
    }); return;
  }
  if (act === 'copen') { openDrawer('child.open'); toast('（演示）这里会跳到官方视图：父会话页头血缘目录 / 右侧 Sidebar 打开它的对话'); return; }
  if (act === 'csend') {
    confirmModal({ title: '派活（经官方通道）', warn: '会向子会话写入一条任务消息，不可撤销。',
      rows: [['收件人', S.children[i].id], ['逐字任务正文', '（见理由栏）'], ['投递方式', '排队下一轮（queue）'], ['理由', '（见理由栏）']],
      needReason: true, okText: '确认发送', onOk: (reason) => toast(`已发送（模拟官方返回 accepted）：${reason.slice(0, 30)}`) }); return;
  }
  if (act === 'ctask') { S.tasks.push({ subject: `跟进 ${S.children[i] ? S.children[i].id : ''} 的产出`, owner: '', blocked: false, st: 's-idle' }); render(); toast('已建成官方任务（写进官方任务板 —— 官方面板现在也能看到它）'); return; }
  if (act === 'ccompact') {
    if (S.sw.compressBusy) { toast('压缩被拒：子会话正在运行，等它空闲再压缩。（busy）', 'err'); return; }
    confirmModal({ title: '压缩子会话（不可逆）', warn: '子会话的历史会被摘要取代，不可逆。失败也通常会留下痕迹。',
      rows: [['目标', S.children[i].id], ['将被替代的区间与条目数', '第 1–3 步 · 共 12 条'], ['不可逆提示', '原文会被摘要取代（不是遮蔽，读不回来）']],
      needReason: false, okText: '确认压缩', onOk: () => { S.children[i].state = 'idle'; render(); toast('压缩完成（演示）：子会话历史出现 compaction/* 事件'); } }); return;
  }
  if (act === 'cinterrupt') {
    confirmModal({ title: '打断子会话', warn: '会向子会话发出取消信号；未完成的工作可能被中断，不可撤销。已提交的工作不会被回滚。',
      rows: [['目标', S.children[i].id], ['当前状态', S.children[i].state === 'running' ? '运行中' : '空闲'], ['信号', '成员走官方 interrupt；裸子会话走 interruptByParent']],
      needReason: false, okText: '确认打断', onOk: () => { S.children[i].state = 'ended'; render(); toast('已打断（演示）'); } }); return;
  }
  if (act === 'pendingSeen') { S.pendingSeen = true; toast('已标记「已查看」（记在插件本地；重启后从父会话日志重扫重建）'); return; }
  if (act === 'pendingHand') { toast('已把结果交回主会话（演示）'); return; }
}

    <div>整页横向溢出：<span class="${overflow ? 'bad' : 'ok'}">${overflow ? '有（不合格）' : '无'}</span></div>
    <h4>本原型不覆盖的门禁</h4>
    <div class="muted">真实会话写入、真实压缩、console 无报错、与 dsh-context 并存 —— 只能在装进 DSH 后验（docs/03 §7）。</div>`;
}

/* ------------------------------------------------------------------ 10. 讲解模式 */
function applyExplain() {
  document.body.classList.toggle('explain', S.explain);
  // 每次渲染都重建序号：先清旧的，避免残留（DOM 会被 render() 整体替换）
  document.querySelectorAll('.exnum').forEach((el) => el.remove());
  const nodes = document.querySelectorAll('[data-explain]');
  let bar = document.querySelector('.explainbar');

  if (S.explain) {
    nodes.forEach((el, idx) => {
      el.dataset.exnum = String(idx + 1);
      /**
       * ⚠️ 关键：讲解的触达点是**这个序号本身**，不是被讲解的元素。
       * 用真实节点（不是 ::after 伪元素，伪元素点不到）—— 于是：
       *   · 点序号 → 看它是做什么的
       *   · 点按钮本身 → 照常走它自己的交互（不被拦截）
       * 之前我在捕获阶段拦了所有 [data-explain] 的点击，导致开着讲解模式就没法试按钮、只能刷新。
       */
      const badge = document.createElement('span');
      badge.className = 'exnum' + (el.closest && el.closest('.trendscroll') ? ' exnum-in' : '');
      badge.textContent = String(idx + 1);
      badge.setAttribute('role', 'button');
      badge.setAttribute('tabindex', '0');
      badge.setAttribute('title', `#${idx + 1} ${(EXPLAIN[el.dataset.explain] || {}).t || ''} —— 点这里看说明（不影响按钮本身）`);
      const show = (e) => {
        e.preventDefault();
        e.stopPropagation();          // 只吃掉这一次点击，别让它触发按钮自身
        openDrawer(el.dataset.explain);
      };
      badge.addEventListener('click', show);
      badge.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') show(e); });
      el.appendChild(badge);
    });
    if (!bar) { bar = document.createElement('div'); bar.className = 'explainbar'; document.body.appendChild(bar); }
    bar.innerHTML = `讲解模式已开：共 <b>${nodes.length}</b> 个可交互元素 · 点**左上角序号**看它是做什么的；**按钮本身照常可用**（<span class="muted">Esc 关闭面板</span>）`;
  } else if (bar) bar.remove();
}

/* ------------------------------------------------------------------ 11. 渲染 + 事件 */
function render() {
  document.documentElement.dataset.theme = S.theme;
  renderSwitches(); renderNotice();
  renderStats(); renderTrend(); renderStep(); renderEvents();
  renderBrowser();
  $('stickyDrafts').hidden = draftCount() === 0;
  $('stickyDrafts').innerHTML = `<span>还有 <b>${draftCount()}</b> 条改动未生效</span>
    <button class="btn sm" data-act="applyAll">逐条应用到会话</button>
    <button class="btn sm ghost" data-act="discardAll">放弃未应用的改动</button>`;
  $('stickyDrafts').querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.act === 'discardAll') {
        confirmModal({ title: '放弃未应用的改动', warn: '只清本地草稿，不影响会话；未保存的输入会丢失。', rows: [['将丢弃', Object.keys(S.drafts).map((s) => '#' + s).join(' · ')]], needReason: false, okText: '确认放弃', onOk: () => { S.drafts = {}; render(); toast('已清空本地草稿（会话未动）'); } });
      } else {
        confirmModal({ title: '逐条应用到会话', warn: '会向会话追加替换记录，之后无法删除；原文对模型永久不可见（日志里仍在）。', rows: Object.keys(S.drafts).map((s) => ['#' + s, (draftOf(Number(s)).text || '').slice(0, 90)]), needReason: false, okText: '确认逐条应用', onOk: () => { Object.keys(S.drafts).forEach((s) => doApply(Number(s))); } });
      }
    };
  });
  renderOrch(); applyExplain(); renderSelfcheck();
}

$('btnTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); };
$('btnExplain').onclick = () => { S.explain = !S.explain; if (!S.explain) closeDrawer(); $('btnExplain').setAttribute('aria-pressed', String(S.explain)); render(); toast(S.explain ? '讲解模式：点任一高亮元素看说明' : '讲解模式已关'); };
$('btnSelfcheck').onclick = () => { S.selfcheck = !S.selfcheck; render(); };
$('btnReset').onclick = () => { S = initial(); render(); toast('原型已重置'); };
$('drawerClose').onclick = () => closeDrawer();
$('modalCancel').onclick = () => { $('modalWrap').hidden = true; };
// 捕获阶段**只做一件事**：窄屏（遮罩式）时点面板外关闭。
// ⚠️ 绝不再拦截 [data-explain] 的点击 —— 那会让讲解模式把按钮本身的交互全部吃掉。
document.addEventListener('click', (e) => {
  const drawer = $('drawer');
  if (!drawer || drawer.hidden) return;
  const narrow = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 899px)').matches : false;
  const insideDrawer = !!(e.target.closest && e.target.closest('.drawer'));
  if (narrow && !insideDrawer) closeDrawer();
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { S.editor = null; $('modalWrap').hidden = true; closeDrawer(); render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.editor) submitEditor();
  if (!S.editor && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const list = reqsOfTurn(S.selTurn), i = list.findIndex((r) => r.seq === S.selSeq);
    const n = list[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (n) selectReq(n, null);
  }
});
