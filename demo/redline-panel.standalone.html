<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上下文批改台 · 交互原型（demo）</title>
<link rel="icon" href="data:," />
<style>
/* ============================================================================
 * 上下文批改台 · 交互原型样式
 * 规则（docs/03 §6）：颜色一律走"主题令牌"，深浅两套自动跟随；不写死十六进制。
 *
 * 移动端适配（参照参考插件 dsh-context 的做法：**设计进去，不是断点堆出来**）：
 *   · 主布局用 flex-wrap 流式列（`flex: 1 1 min(420px, 100%)`）→ 窄屏自动单列，**不需要 @media**
 *   · 卡片内部用 **@container 容器查询**（卡片自身 `container-type: inline-size`）
 *   · 横向滚动条统一 `overscroll-behavior-x: contain`（左右滑到头不再触发浏览器返回/前进）
 *     ＋ demo.js 里的 containHorizontalOverscroll（WebKit 会忽略该属性，只能靠取消 wheel 兜住）
 *   · `pointer: coarse`（真触屏）才放大到 44px 触控目标 —— 桌面窄窗口不算触屏
 *   · 安全区：env(safe-area-inset-*) 让底部按钮不被 iPhone 手势条盖住
 * ==========================================================================*/

:root {
  --dsw-alias-bg-layer-1: #ffffff;
  --dsw-alias-bg-layer-2: #ffffff;
  --dsw-alias-bg-layer-3: #f4f4f5;
  --dsw-alias-label-primary: #18181b;
  --dsw-alias-label-secondary: #52525b;
  --dsw-alias-label-caption: #8b8b93;
  --dsw-alias-border-l1: #e4e4e7;
  --dsw-alias-border-l2: #d4d4d8;
  --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .05);
  --dsw-alias-brand: #4f46e5;
  --ds-color-green: #16a34a;
  --ds-color-teal: #0d9488;
  --ds-color-purple: #7c3aed;
  --ds-color-orange: #ea580c;
  --ds-color-blue: #2563eb;
  --ds-color-amber: #d97706;
  --ds-color-red: #dc2626;
  --ds-color-indigo: #4f46e5;
  --ds-shadow: 0 8px 24px rgba(0, 0, 0, .10);
  --ds-radius: 10px;
  --ds-touch: 30px;
  --dsh-scrollbar-width: 8px;
}

/* 深色：**跟随系统**（用户 2026-10-01 要求去掉切换按钮）。
 * 选择器刻意用 `body[data-ds-dark-theme]` —— 这正是 DSH 自己的深色选择器（docs/03 V2），
 * 由 demo.js 依据 `prefers-color-scheme` 设置；`?theme=dark|light` 是验证用的调试钩子。
 * 好处：demo 与真机走同一条通道，不再各写一套开关。 */
body[data-ds-dark-theme] {
  --dsw-alias-bg-layer-1: #232324;
  --dsw-alias-bg-layer-2: #2c2c2e;
  --dsw-alias-bg-layer-3: #1b1b1c;
  --dsw-alias-label-primary: #f4f4f5;
  --dsw-alias-label-secondary: #b9b9c0;
  --dsw-alias-label-caption: #8b8b93;
  --dsw-alias-border-l1: #3a3a3d;
  --dsw-alias-border-l2: #4a4a4e;
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .07);
  --dsw-alias-brand: #8b8bf5;
  --ds-color-green: #4ade80;
  --ds-color-teal: #2dd4bf;
  --ds-color-purple: #c084fc;
  --ds-color-orange: #fb923c;
  --ds-color-blue: #60a5fa;
  --ds-color-amber: #fbbf24;
  --ds-color-red: #f87171;
  --ds-color-indigo: #a5b4fc;
  --ds-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
/* ⚠️ 必须显式声明：下面 .modal-wrap/.drawer 用了 display:flex，会盖掉 UA 对 [hidden] 的 display:none */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--dsw-alias-bg-layer-3);
  color: var(--dsw-alias-label-primary);
  font: 14px/22px -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;               /* 页面本身绝不横向滚：横向滚动只发生在卡片内部的滚动条里 */
}

/* ---------- 顶栏 + 状态开关（窄屏自动换行，不横向溢出） ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: var(--dsw-alias-bg-layer-1);
  border-bottom: 1px solid var(--dsw-alias-border-l1);
}
.brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand .tag { font-size: 12px; color: var(--dsw-alias-label-caption); border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; padding: 1px 8px; }
.brand .link { color: var(--dsw-alias-brand); text-decoration: none; font-size: 12px; }
.switches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.sw {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; color: var(--dsw-alias-label-secondary);
  background: transparent; cursor: pointer; min-height: var(--ds-touch); white-space: nowrap;
}
.sw[aria-pressed="true"] { border-color: var(--dsw-alias-brand); color: var(--dsw-alias-label-primary); }
.sw i { width: 8px; height: 8px; border-radius: 999px; background: var(--dsw-alias-label-caption); }
.sw[aria-pressed="true"] i { background: var(--ds-color-green); }

.btn {
  min-height: var(--ds-touch); padding: 5px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary); font-size: 12px;
}
.btn:hover { background: var(--dsw-alias-interactive-bg-hover); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--ds-color-red); color: var(--ds-color-red); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 26px; padding: 2px 8px; font-size: 12px; }

/* 分段开关（按轮次/按步骤 · 总计/增量 · 自适应）：参照参考插件的 .lc-seg */
.seg {
  min-height: var(--ds-touch); padding: 3px 9px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--dsw-alias-border-l2); background: transparent;
  color: var(--dsw-alias-label-secondary); border-radius: 7px; white-space: nowrap;
}
.seg + .seg { margin-left: -1px; }
.seg:first-of-type { border-radius: 7px 0 0 7px; }
.seg[aria-pressed="true"] { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); border-color: var(--dsw-alias-brand); font-weight: 600; }
.seg:disabled { opacity: .45; cursor: not-allowed; }
.segsep { width: 8px; }

/* ---------- 说明条 ---------- */
.noticebar {
  margin: 12px 14px 0; padding: 8px 12px; border-radius: var(--ds-radius);
  background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1);
  color: var(--dsw-alias-label-secondary); display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}

/* ---------- 主布局：**流式列**（无 @media：窄屏自动单列） ---------- */
.cols { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 14px; align-items: flex-start; }
.col { flex: 1 1 min(420px, 100%); min-width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1);
  border-radius: var(--ds-radius); padding: 10px 12px; min-width: 0;
  container-type: inline-size;         /* ← 卡片内部用容器查询自适应（参照参考插件的 @container 写法） */
}
.card-title {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  /* 与「快照与子会话」的块标题**同一套语言**：标题下一道细虚线 + 右侧读数（两端对齐） */
  margin: 0 0 8px; padding-bottom: 6px;
  border-bottom: 1px dashed var(--dsw-alias-border-l1);
  font-weight: 600; font-size: 13px; color: var(--dsw-alias-label-primary);
}
.card-title .hint { font-weight: 400; font-size: 12px; color: var(--dsw-alias-label-caption); }
.card-title .bmeta { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--dsw-alias-label-caption); }

/* ---------- 状态数字卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 8px; }
.stat { border: 1px solid var(--dsw-alias-border-l1); border-radius: 8px; padding: 8px; min-width: 0; }
.stat b { display: block; font-size: 18px; line-height: 24px; }
.stat span { font-size: 12px; color: var(--dsw-alias-label-caption); }

/* ---------- 趋势图（参照参考插件 trendChart：固定柱宽 + 横向滚动 + 吸附边界的 overscroll） ---------- */
.trendwrap { display: flex; gap: 6px; align-items: stretch; }
.axis { position: relative; width: 40px; height: 150px; padding-top: 18px; color: var(--dsw-alias-label-secondary); font-size: 11px; flex: none; }
.axis span { position: absolute; right: 0; line-height: 1; }
.axis span:nth-child(1) { top: 13px; }
.axis span:nth-child(2) { top: 69px; }
.axis span:nth-child(3) { top: 125px; }
/* 定位上下文：tooltip 必须挂在**滚动容器外面**——放里面会撑大 scrollWidth，
   让横向滚动条在每次 hover 时开合、整张卡片跟着跳（参考插件原话）。 */
.trendpos { position: relative; flex: 1; min-width: 0; }
.chart-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 6;
  display: flex; flex-direction: column; gap: 2px;
  max-width: 100%; box-sizing: border-box; overflow-wrap: anywhere;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 6px; padding: 4px 9px; font-size: 12px; line-height: 17px;
  color: var(--dsw-alias-label-primary); box-shadow: 0 2px 8px rgba(0,0,0,.18);
  pointer-events: none;                     /* 不许挡住下面的柱子，否则 hover 会闪 */
}
.chart-tip span + span { color: var(--dsw-alias-label-secondary); }
.chart-tip .tipmark { color: var(--ds-color-amber); }
.trendscroll {
  flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain;              /* 滑到头不链到浏览器的返回/前进 */
  scrollbar-gutter: stable;                    /* 有无滚动条都不跳版 */
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  padding-bottom: var(--dsh-scrollbar-width, 8px);
}
.trendinner { width: max-content; min-width: 100%; }
.markers { position: relative; height: 14px; }
.mark { position: absolute; top: 0; font-size: 11px; color: var(--ds-color-amber); text-align: center; }
.bars { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 112px; }
/* 趋势柱体（用户 2026-10-01 反馈：移上去、点中了都看不出是哪一根）
 * 照参考插件 dsh-context 的 .lc-bar 定死三件事：
 *   ① **整列**都是命中区（height:100%），色块画在内层 .tbar-fill 上 —— 短柱子上方的空白也能移中；
 *   ② hover 给整列底色 + 虚线框 + 色块提亮（原来只有一根 1px 虚线，等于没做）；
 *   ③ 选中给实线框 + 底色，并且**声明在 hover 之后**。
 * ⚠️ 顺序陷阱（参考插件源码里专门注释过）：`.sel` 与 `:hover` 同特异性，
 *    选中规则若排在 hover 前面，鼠标停在刚点过的柱子上时虚线 hover 会盖掉实线选中，
 *    只有把指针移开才看得见"选中了"。所以下面三段的先后顺序不能改。 */
.tbar {
  position: relative;
  flex: none; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: flex-end;
  border-radius: 2px 2px 0 0; outline: 1px dashed transparent; outline-offset: 1px;
  transition: background-color .15s ease-in-out, outline-color .15s ease-in-out;
}
/* 柱子本体只是**整列命中区**；真正的图形是内层按类别分出来的段（照参考插件 dsh-context 的
 * `.lc-bar` + `.lc-cat-seg`：颜色 = 类别，段高 = 该类在这根柱子里的量）。 */
.tbar-fill { display: block; width: 100%; transition: filter .15s ease-in-out; }
.tbar-stack { display: flex; flex-direction: column-reverse; }   /* 总计：段从下往上堆 */
.tbar-stack > .cseg:first-child { border-radius: 0 0 2px 2px; }
.tbar-stack > .cseg:last-child { border-radius: 2px 2px 0 0; }
/* ⚠️ 类别色段叫 .cseg，**不能**叫 .seg —— .seg 已经是分段控件按钮的类（上面第 110 行），
 * 撞名会把这些按钮变成 display:block; width:100%（自己踩过一次）。 */
.cseg { display: block; width: 100%; }
/* 增量：围绕**零线**分成两臂 —— 正差向上、负差向下，颜色仍是类别（方向表示正负） */
.tbar-diverge { position: absolute; inset: 0; height: 100%; }
.arm { position: absolute; left: 0; width: 100%; display: flex; }
.arm-up { flex-direction: column-reverse; }
.arm-up > .cseg:last-child { border-radius: 2px 2px 0 0; }
.arm-down { flex-direction: column; }
.arm-down > .cseg:last-child { border-radius: 0 0 2px 2px; }
.zeroline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--dsw-alias-border-l2); pointer-events: none; }
/* ① 悬停预览：整列底色 + 虚线框。
 * ⚠️ **不许**用 `filter: brightness()` 提亮柱子 —— 那会把类别色整体改掉，
 * 于是"柱体的紫/橙/黄和右侧分类树的色块对不上"（用户 2026-10-01 实测反馈）。
 * 反馈一律走**列底色 + 框**这两条不改变色值的通道。 */
.tbar:hover { background: var(--dsw-alias-interactive-bg-hover); outline-color: var(--dsw-alias-brand); }
/* ② 选中那一轮里的其它柱子：整轮底色（照参考插件的 lc-bar-in-turn）——按步骤模式下一轮多根，靠它才认得出是哪一轮 */
.tbar.in-turn { background: color-mix(in srgb, var(--dsw-alias-brand) 10%, transparent); }
/* ③ 选中的柱子：实线框 + 底色（声明在 hover 之后，鼠标停在它身上也看得清） */
.tbar.sel {
  background: color-mix(in srgb, var(--dsw-alias-brand) 20%, transparent);
  outline: 2px solid var(--dsw-alias-label-primary); outline-offset: 1px;
}
.strip { display: flex; align-items: stretch; gap: 3px; margin-top: 2px; }
.tcell {
  flex: none; height: 22px; padding: 0; cursor: pointer; overflow: hidden; white-space: nowrap;
  border: 1px solid var(--dsw-alias-border-l1); border-radius: 4px; font-size: 11px;
  background: transparent; color: var(--dsw-alias-label-caption);
}
.tcell:hover { background: var(--dsw-alias-interactive-bg-hover); }
/* ⚠️ 用户 2026-10-02：「（那排轮号）17 点了没有反应」—— 原来这排格子**没有选中态**，
 * 点完看不出哪一格被选中（按轮次模式又恰好不弹提示）⟹ 现在给当前轮那一格描边。
 * 只改这一格的外观，不动坐标轴宽度（宽度跟着轮长走，改了就与柱子对不齐）。 */
.tcell.is-sel { border-color: var(--dsw-alias-brand); color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-hover); font-weight: 600; }

/* 步级快捷片 */
.stepchips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chipstep {
  min-height: var(--ds-touch); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--dsw-alias-border-l2); background: transparent; color: var(--dsw-alias-label-secondary);
}
.chipstep.sel { border-color: var(--dsw-alias-brand); color: var(--dsw-alias-label-primary); font-weight: 600; }
.chipstep.live { border-style: dashed; }

/* ---------- 分类树 ---------- */
.catrow {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; border-radius: 8px; padding: 6px 8px;
  color: var(--dsw-alias-label-primary); cursor: pointer; min-height: var(--ds-touch);
}
.catrow:hover { background: var(--dsw-alias-interactive-bg-hover); }
.catrow .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); opacity: .6; flex: none; }
.catrow[aria-expanded="true"] .chev { transform: rotate(45deg); }
.catrow .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; cursor: pointer; }
.catrow .swatch.focused { box-shadow: 0 0 0 2px var(--dsw-alias-label-primary); }
.catrow .label { flex: 0 1 auto; }
.catrow .grow { flex: 1 1 auto; }
.catrow .count, .catrow .tokens, .catrow .pct { font-size: 12px; color: var(--dsw-alias-label-caption); margin-left: 6px; white-space: nowrap; }
.catbody { padding: 2px 0 6px 20px; }
.catsq { width: 12px; height: 12px; border-radius: 3px; flex: none; cursor: pointer; }

/* ---------- 元素行 ---------- */
.row { border-top: 1px dashed var(--dsw-alias-border-l1); }
.row:first-child { border-top: 0; }
.row-main {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; padding: 5px 6px; color: var(--dsw-alias-label-primary);
  cursor: pointer; min-height: var(--ds-touch);
}
.row-main:hover { background: var(--dsw-alias-interactive-bg-hover); border-radius: 6px; }
.row-main .tagchip { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-secondary); white-space: nowrap; }
.row-main .preview { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dsw-alias-label-secondary); }
.row-main .tok { font-size: 11px; color: var(--dsw-alias-label-caption); white-space: nowrap; }
.row-body { padding: 6px 8px 10px 22px; color: var(--dsw-alias-label-secondary); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.row-body .meta { color: var(--dsw-alias-label-caption); font-size: 12px; margin-bottom: 4px; }
.row.shadowed { opacity: .55; }
.row.shadowed .preview { text-decoration: line-through; }

/* ---------- 动作条 ---------- */
.actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 6px 6px 22px; }
.seq { font-size: 11px; color: var(--dsw-alias-label-caption); border: 1px solid var(--dsw-alias-border-l1); border-radius: 999px; padding: 0 6px; }
.chip-soft { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px dashed var(--dsw-alias-border-l2); color: var(--dsw-alias-label-caption); }
.chip-draft { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-amber); color: var(--ds-color-amber); }
.chip-shadow { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-caption); }
/* 输入去向标记（`docs/03` R3.3.3）：**只有两种**，界面上凡"让你写字"的地方都必须带一个。
 *   `.dest-local` = 只写本地（灰虚线，与「尚无固定块」同一套语言）
 *   `.dest-model` = 会进模型上下文（琥珀实线：提醒"模型会读到这段话，写清楚 —— 别写给自己看的备忘"）
 * 字段标签里的标记要跟文字同排（`.field span` 默认是 block）→ 单独给 inline-block。 */
.dest-model { border-style: solid; border-color: var(--ds-color-amber); color: var(--ds-color-amber); }
.dest-local { opacity: .85; }
.field span > .chip-soft, .orch-toolbar .chip-soft { display: inline-block; margin-left: 4px; }
.chain { font-size: 12px; color: var(--dsw-alias-label-secondary); }

/* ---------- 上下文事件（会变的做成行，不变的收成小字） ---------- */
.evsum { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--dsw-alias-label-secondary); margin: 2px 0 6px; }
.evchip { font-size: 11px; border-radius: 999px; padding: 0 7px; border: 1px solid var(--dsw-alias-border-l2); }
.evchip-done { border-color: var(--ds-color-indigo); color: var(--ds-color-indigo); }
.evchip-todo { color: var(--dsw-alias-label-caption); }
.evlist { display: flex; flex-direction: column; gap: 4px; }
.evrow { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px;
  border: 1px solid var(--dsw-alias-border-l2); border-left-width: 3px; background: var(--dsw-alias-bg-layer-2); }
.evrow.is-done { border-left-color: var(--ds-color-indigo); }
.evrow.is-todo { border-left-color: var(--dsw-alias-border-l2); border-style: dashed; background: transparent; opacity: .62; }
.evicon { font-size: 12px; }
.evrow.is-todo .evicon { filter: grayscale(1); }
.evmain { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; font-size: 12px; }
.evlabel { color: var(--dsw-alias-label-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evat { font-size: 11px; color: var(--dsw-alias-label-caption); white-space: nowrap; }
.evstate { font-size: 11px; border-radius: 999px; padding: 0 6px; white-space: nowrap;
  border: 1px solid var(--ds-color-indigo); color: var(--ds-color-indigo); }
.evrow.is-todo .evstate { border-color: var(--dsw-alias-border-l2); color: var(--dsw-alias-label-caption); }
.evhint { margin: 6px 0 0; }

/* ---------- 内联编辑器 ---------- */
.editor { margin: 0 6px 10px 22px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 8px; padding: 8px; background: var(--dsw-alias-bg-layer-2); }
.editor .etitle { font-size: 12px; font-weight: 600; margin: 0 0 2px; }
.editor .enote { font-size: 12px; color: var(--dsw-alias-label-secondary); margin: 0 0 8px; }
.field { display: block; margin-bottom: 8px; }
.field span { display: block; font-size: 12px; color: var(--dsw-alias-label-caption); margin-bottom: 3px; }
.field textarea, .field input, .modal input {
  width: 100%; background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary);
  border: 1px solid var(--dsw-alias-border-l2); border-radius: 6px; padding: 6px; font: inherit; resize: vertical;
}
.efoot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.eblocked { color: var(--ds-color-amber); font-size: 12px; margin: 4px 0; }
.emsg-err { color: var(--ds-color-red); font-size: 12px; margin: 4px 0; }
.emsg-ok { color: var(--ds-color-green); font-size: 12px; margin: 4px 0; }

/* ---------- 版本历史 ---------- */
.history { margin: 0 6px 10px 22px; border: 1px dashed var(--dsw-alias-border-l2); border-radius: 8px; padding: 8px; }
.vrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
.vrow .vlabel { font-size: 12px; color: var(--dsw-alias-label-primary); min-width: 150px; }
.vrow .vtext { flex: 1 1 200px; min-width: 0; font-size: 12px; color: var(--dsw-alias-label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .vwhy { font-size: 11px; color: var(--dsw-alias-label-caption); }

/* ---------- 快照与子会话 ----------
 * 排布语法与「上下文浏览器 / 上下文事件」一致：小标题(.subhead) + 行(.orch-row)。
 * 每个子会话/成员行是**两行**：上行身份（id / 来源 / 状态 / 描述），下行动作（缩进 22px，与 .actions 同款）。
 * 理由（用户 2026-09-30 反馈"这块没有其他几个部分好看"）：旧写法把「打开」留在右上角、
 * 其余按钮换行后带悬挂缩进，同一张卡里两行子会话的排布还各不相同。 */
.orch-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 0 4px; }
.orch-toolbar input { flex: 1 1 220px; min-width: 0; }
.orch-toolbar .cap { flex: 1 1 100%; }
.warn-text { color: var(--ds-color-amber); }
.orch-row { padding: 6px 0 2px; border-top: 1px dashed var(--dsw-alias-border-l1); }
.orch-row:first-child { border-top: 0; }
.orch-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.snapid { font-family: ui-monospace, monospace; font-size: 12px; }
.orch-desc { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dsw-alias-label-secondary); font-size: 12px; }
.orch-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0 4px 22px; }
.orch-actions .cap { margin-left: 2px; }   /* 说明挨着按钮，不顶到最右（顶到最右会显得左边空） */
.orch-note { font-size: 12px; color: var(--dsw-alias-label-secondary); overflow-wrap: anywhere; }
.badge-src-own { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-teal); color: var(--ds-color-teal); }
/* `docs/03` R2.1/R4.6：助手消息行的徽章「助手消息仅可批注」（它只给批注，不给编辑） */
.badge-asst { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px dashed var(--dsw-alias-label-caption); color: var(--dsw-alias-label-caption); }
.badge-src-team { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--ds-color-purple); color: var(--ds-color-purple); }
.badge-state { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-secondary); }
.dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.dot-ok { background: var(--ds-color-green); }
.dot-warn { background: var(--ds-color-amber); }
.cap { font-size: 12px; color: var(--dsw-alias-label-caption); overflow-wrap: anywhere; }
.list-label { margin: 8px 0 2px; }

/* ---------- 官方团队区块（只读） ---------- */
/* ---------- 「快照与子会话」卡：按内容块分区 ----------
 * 用户 2026-10-01：「整块挤成一个大竖条、看着乱；宽屏应该横排，窄屏竖排但每块要明显区分」。
 * 宽屏（≥1040px）：冻结一列（跨两行）、子会话索引 + 待处理一列、官方团队跨两列。
 * 窄屏：单列堆叠，靠 .orchblock 的边框/底色/标题把四块分开（不许挤成一片）。 */
.orchgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.orchblock {
  min-width: 0; padding: 6px 8px 8px; border-radius: 8px;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-3);   /* 比卡片底再深一档：光靠边框区分不够"明显" */
}
.orchblock > .blocktitle {
  margin: 2px 0 4px; padding-bottom: 4px;
  border-bottom: 1px dashed var(--dsw-alias-border-l1);   /* 标题下一道虚线，块身份一眼可见 */
}
/* ---------- 借鉴 V0 的"小细节"（配色不动，只搬结构与边框语言） ----------
 * ① 块标题两端对齐：左块名 + 右读数；② 行间细虚线；③ 行右"状态 + ›"；④ 块底整宽次级按钮。
 * ⚠️ "焦点块加彩色标记"（无论整圈描边还是左侧竖条）已被用户否掉 —— 与整页风格不和谐，别再加回来。 */
.blocktitle .bmeta { margin-left: auto; font-weight: 400; color: var(--dsw-alias-label-caption); font-size: 12px; }
/* 行间细虚线：分类树 / 浏览器行为与分块内的行同一种语言 */
.catbody .row + .row,
#cardBrowser .row + .row { border-top: 1px dashed var(--dsw-alias-border-l1); }
/* 浏览器行的动作条与正文之间也来一道（轻），让"身份 / 动作"两层更清楚 */
#cardBrowser .row .actions { border-top: 1px dashed var(--dsw-alias-border-l1); padding-top: 4px; }

.orchblock .orch-row + .orch-row,
.orchblock .orch-row + .cap,
.orchblock .task + .task { border-top: 1px dashed var(--dsw-alias-border-l1); }
.orch-id .chev { margin-left: auto; color: var(--dsw-alias-label-caption); font-size: 14px; line-height: 1; padding-left: 6px; }
.btn.block { display: block; width: 100%; text-align: center; }
.orchblock:has(.warn-text) { border-color: var(--ds-color-amber); }
.orchblock > .subhead + .subhead { margin-top: 6px; }
@media (min-width: 1040px) {
  .orchgrid {
    grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr);
    grid-template-areas: "spawnone children" "spawnone pending" "team team";
    align-items: start;
  }
  .orchblock[data-block="spawnone"] { grid-area: spawnone; }
  .orchblock[data-block="children"] { grid-area: children; }
  .orchblock[data-block="pending"] { grid-area: pending; }
  .orchblock[data-block="team"] { grid-area: team; }
}

.subhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--dsw-alias-label-secondary); }
.subhead .hint { font-weight: 400; color: var(--dsw-alias-label-caption); }
.roster { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; }
.member { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; padding: 1px 8px; }
.task { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; border-top: 1px dashed var(--dsw-alias-border-l1); }
.task:first-child { border-top: 0; }
.task .subject { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .owner { margin-left: auto; white-space: nowrap; }
.task .tstat, .member .mstat { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.s-idle { background: var(--dsw-alias-label-caption); }
.s-run { background: var(--ds-color-amber); }
.s-block { background: var(--ds-color-orange); }
.s-done { background: var(--ds-color-green); }
.s-fail { background: var(--ds-color-red); }
.muted { color: var(--dsw-alias-label-caption); }

/* ---------- 吸顶未生效 ---------- */
.sticky-drafts {
  position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 30;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: var(--ds-radius);
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--ds-color-amber);
}

/* ---------- 抽屉 / 弹窗 / 回执 ---------- */
/* 讲解面板：像 DSH 右侧栏一样**推**出来 —— 内容被挤窄，而不是被盖住。
 * 做法：面板还是 fixed 贴右边，但打开时给 body 加 padding-right（腾出同宽的空间），
 * 于是所有内容重新排版到左侧、右侧不再被遮住，也就不用"先关掉才能看"。
 * 窄屏放不下 420px 的推挤 → 回退成遮罩式（真侧栏在手机上也这么做）。 */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 60;
  background: var(--dsw-alias-bg-layer-2); border-left: 1px solid var(--dsw-alias-border-l2);
  box-shadow: var(--ds-shadow); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: drawer-in .16s ease-out;
}
@keyframes drawer-in { from { transform: translateX(12px); opacity: .6; } to { transform: none; opacity: 1; } }
body.drawer-open { padding-right: min(420px, 100vw); }
body { transition: padding-right .18s ease-out; }
/* 窄屏/手机：推不开（一共才那么点宽）→ 退回遮罩式，这时才需要"点外面关掉" */
@media (max-width: 899px) {
  body.drawer-open { padding-right: 0; }
  body.drawer-open::before { content: ''; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.35); }
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
.drawer-body { padding: 10px 12px; overflow: auto; -webkit-overflow-scrolling: touch; }
.kv { margin-bottom: 8px; }
.kv b { display: block; font-size: 12px; color: var(--dsw-alias-label-caption); font-weight: 500; }
.kv div { font-size: 13px; overflow-wrap: anywhere; }
.modal-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal { width: min(560px, 100%); max-height: min(86vh, 86dvh); background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2); border-radius: var(--ds-radius); box-shadow: var(--ds-shadow); display: flex; flex-direction: column; }
.modal-head { padding: 10px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
.modal-body { padding: 10px 12px; overflow: auto; -webkit-overflow-scrolling: touch; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--dsw-alias-border-l1); flex-wrap: wrap; }
.warn { margin: 0 0 10px; color: var(--ds-color-amber); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { padding: 4px 0; border-top: 1px dashed var(--dsw-alias-border-l1); font-size: 13px; overflow-wrap: anywhere; }
.list li:first-child { border-top: 0; }
.list b { color: var(--dsw-alias-label-caption); font-weight: 500; margin-right: 6px; }
.modal-reason { display: block; margin-top: 10px; }
.modal-reason span { display: block; font-size: 12px; color: var(--dsw-alias-label-caption); margin-bottom: 3px; }

.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 560px); }
.toast { max-width: 100%; background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2); border-radius: 999px; padding: 6px 14px; box-shadow: var(--ds-shadow); font-size: 13px; overflow-wrap: anywhere; }
.toast.err { border-color: var(--ds-color-red); color: var(--ds-color-red); }

/* ---------- 自测面板 ---------- */
.selfcheck {
  position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  width: min(460px, calc(100vw - 24px)); max-height: 46vh; overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2);
  border-radius: var(--ds-radius); box-shadow: var(--ds-shadow); padding: 10px 12px; font-size: 12px;
}
.selfcheck h4 { margin: 8px 0 4px; font-size: 12px; color: var(--dsw-alias-label-secondary); }
.selfcheck .ok { color: var(--ds-color-green); }
.selfcheck .bad { color: var(--ds-color-red); }
.selfcheck code { background: var(--dsw-alias-bg-layer-3); padding: 0 4px; border-radius: 4px; }

/* 下拉外面包一层：编号/高亮要挂在**能装子节点**的元素上
 * （<select> 只能装 option，塞进去的编号会被浏览器丢掉 —— 用户实测"编号看不见"就是这个） */
.pickwrap { position: relative; display: inline-flex; align-items: center; }

/* 「?」帮助标记：给**动态出现**的按钮用（编辑器里的提交/取消、确认框里的确认）。
 * 做法与讲解模式的序号**完全一致**：贴着元素的**左上角**飘一个小圆标 —— 一眼就知道它对应哪个按钮。
 * 用户 2026-10-01：「我说的问号不是在按钮后面单独加一个问号……这么做用户体验看着很差」。 */
.qwrap { position: relative; display: inline-flex; align-items: center; }
.qfloat {
  position: absolute; top: -9px; left: -8px; z-index: 8;
  min-width: 16px; padding: 0 4px; text-align: center; cursor: help; user-select: none;
  background: var(--dsw-alias-brand); color: #fff; font-size: 10px; line-height: 15px;
  border-radius: 999px; box-shadow: 0 0 0 1px var(--dsw-alias-bg-layer-1);
}
.qfloat:hover, .qfloat:focus-visible { outline: 2px solid var(--dsw-alias-label-primary); outline-offset: 1px; }
/* "这条批注针对哪一条"：用人话（轮/步/类别/正文开头）说，seq 退居括号里 */
.targetbox {
  margin: 4px 0 8px; padding: 6px 8px; border-left: 3px solid var(--dsw-alias-brand);
  background: var(--dsw-alias-bg-layer-3); border-radius: 4px;
  font-size: 12px; color: var(--dsw-alias-label-secondary); overflow-wrap: anywhere;
}
/* 编辑器里的「高级」折叠（思考文本这类多数消息没有的字段） */
.adv { margin: 4px 0 8px 22px; }
.adv summary { cursor: pointer; font-size: 12px; color: var(--dsw-alias-label-secondary); }
/* 批注的"作废范围"选择器：默认就这一条，要扩大才选 */
.pickone { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dsw-alias-label-secondary); }
.pickone input { width: auto; min-height: 0; }
.esteps { margin: 6px 0 0; }

/* ---------- 讲解模式 ----------
 * ⚠️ 硬规矩：讲解高亮**只能画在伪元素上**，不许占用元素自身的 outline / background / border。
 * 原因（用户 2026-10-01 实测）：`body.explain [data-explain]` 的特异性是 (0,2,1)，高于
 * `.tbar:hover` / `.tbar.sel`（都是 0,2,0）→ 直接把柱体的 hover/选中整片盖掉：
 * 开讲解后每根柱子都是同一条虚线框，选中那根也分不出来。用 ::after 就永远不会打架。 */
body.explain [data-explain] { position: relative; }
/* 高亮**跟着编号走**：只给真正挂了编号的元素画环（applyExplain 会给它们加 .explain-num）。
 * 若对全部 [data-explain] 画环，趋势图里 28~72 根柱子会各自带一个虚线框 —— 图表就不像原样了，
 * 而用户要的恰恰是"讲解模式只加编号、不改原来的样子"。 */
body.explain [data-explain].explain-num::after {
  content: ''; position: absolute; inset: -1px; border: 1px dashed var(--dsw-alias-brand);
  border-radius: 4px; pointer-events: none;
}
/* 序号是**真实节点**（伪元素点不到）：只有点它才出讲解，点按钮本身照常交互 */
.exnum {
  position: absolute; top: -9px; left: -8px; z-index: 7;
  min-width: 16px; padding: 0 4px; text-align: center; cursor: help; user-select: none;
  background: var(--dsw-alias-brand); color: #fff; font-size: 10px; line-height: 15px;
  border-radius: 999px; box-shadow: 0 0 0 1px var(--dsw-alias-bg-layer-1);
}
.exnum:hover, .exnum:focus-visible { outline: 2px solid var(--dsw-alias-label-primary); outline-offset: 1px; }
/* 横向滚动容器里（overflow-y 被算成 hidden）序号会被裁掉 → 放到元素内部。
 * 注意：柱子本体已经是整列高度（112px），编号放得下，不再需要给柱体加 min-height。 */
.exnum-in { top: 1px; left: 1px; }
.explainbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 55;
  width: min(92vw, 620px); text-align: center;
  background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-brand);
  border-radius: 999px; padding: 6px 14px; font-size: 12px; box-shadow: var(--ds-shadow);
}

/* ============================================================================
 * 卡片内部自适应：容器查询（不是 @media）—— 卡片被挤窄时自己改排布
 * ==========================================================================*/
@container (max-width: 520px) {
  .trendwrap { flex-direction: column; }
  .axis { display: none; }                          /* 太窄时不画纵轴，省出横向空间 */
  .card-title .hint { display: none; }
}
@container (max-width: 360px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row-main .tagchip { display: none; }              /* 极窄时只留正文预览与 token */
}

/* ============================================================================
 * 真触屏（pointer: coarse）：把可点区域放大到 ≥44px —— 桌面窄窗口不算触屏
 * ==========================================================================*/
@media (pointer: coarse) {
  :root { --ds-touch: 44px; }
  /* 注意：这里**不再**给 .tbar 设 min-height —— 柱子本体已经是整列高度（112px），
   * 命中区本来就远超 44px；旧写法写的 `.tbar { min-height: 2px }` 是"外层只放点击区、
   * 柱子自身保持数据高度"那套结构的遗留，现在结构反过来了（见上面 .tbar 注释）。 */
  .btn, .btn.sm, .seg, .chipstep, .sw, .catrow, .row-main, .tcell { min-height: 44px; }

function firstReqAtOrAfter(seq) {

/** 这一根柱子（按步骤模式）上挂着的事件；正常 0 或 1 条 */
function markersOfReq(req) {

/** 这一根柱子（两种粒度通用）上挂着的事件：
 *  按轮次时该轮各步的标记会合并（因为一轮只有一根柱，不能把事件吞掉）。 */
function markersOfBar(item) {
  if (S.trendGran !== 'turn') return markersOfReq(item);
  const seen = new Set();
  return reqsOfTurn(item.turn).flatMap((r) => markersOfReq(r)).filter((ev) => (seen.has(ev.seq) ? false : seen.add(ev.seq)));
}

function nodesOfReq(req, visibleOnly) {

  const seqs = [...new Set(

      .concat(S.extraNodes.filter((n) => n.requestSeq === req.seq).map((n) => n.seq))
  )];

/** 兜住 WebKit 忽略 overscroll-behavior-x 的情况（参照参考插件 overscroll.ts）：
 *  横向滑到头时取消这次 wheel，否则会触发浏览器的"左滑返回/右滑前进"，整个页面被带出去。 */
function containHorizontalOverscroll(el) {
  if (!el) return;
  el.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    const atStart = e.deltaX < 0 && el.scrollLeft <= 0;
    const atEnd = e.deltaX > 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
    if (atStart || atEnd) e.preventDefault();
  }, { passive: false });
}

function toast(msg, kind) {

}
/** 打开讲解面板：**推**出右侧栏（body 加 drawer-open → 内容被挤窄、不被遮住） */
/** 讲解词里用 `**粗体**` 写强调（照参考插件的写法）。抽屉是 innerHTML，所以要转成 <b>，
 *  否则页面上会原样显示两个星号（实测踩过：说明栏与抽屉里都出现过字面的 `**`）。 */
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function openDrawer(key) {
  const e = EXPLAIN[key];
  if (!e) return;
  document.body.classList.add('drawer-open');   // 关键：推挤而不是覆盖

    <div class="kv"><b>对应规格</b><div>${(e.refs || []).map(esc).join(' · ')}</div></div>`;
  $('drawer').hidden = false;
}

   * 答：**两种都有，取决于哪个框** —— 所以**每个框必须自己写明去向**，不许所有框共用一句
   * 「理由（会写进记录）」（那种写法对"只写本地"与"会进模型上下文"是同一句话，等于没说）。
   * 四档去向（`docs/03` R3.3 的硬要求）：

/* ---------- 5.1 上下文趋势（按轮次 / 按步骤 · 总计 / 增量 · 自适应 · 聚焦 · ✂） ---------- */
const BAR_W = 14, BAR_GAP = 3, CHART_H = 112;

/**
 * 每根柱子**按类别拆开**（照参考插件 dsh-context 的 trendChart）：
 *   · 总计模式：`parts[cat]` = 该类这次的上下文量 → 柱体是 7 个类别的堆叠，颜色 = 类别；
 *   · 增量模式：`parts[cat]` = 该类与上一根柱子的差 → 正差向上、负差向下（方向表示正负，颜色仍是类别）。
 * 参考实现的原话："positive category deltas pile UP from the zero line, negative ones hang DOWN
 * from it, both in category colors (direction carries the sign, color the category)"。
 * 之前我们的实现是"整根一个品牌色、负值涂红"，既看不出构成，也让增量模式失去意义。
 */
function barParts(req, prevReq) {
  const out = {};
  for (const c of CATS) {
    const v = metricOf(req, c.key);
    out[c.key] = S.trendMode === 'delta' ? v - (prevReq ? metricOf(prevReq, c.key) : 0) : v;
  }
  if (S.trendCat) {                    // 聚焦某一类时：只保留那一类（其余置 0）
    for (const c of CATS) if (c.key !== S.trendCat) out[c.key] = 0;
  }
  return out;
}
function trendItems() {
  const list = S.trendGran === 'turn'
    ? (() => {                                   // aggregateByTurn：一轮 = 该轮**末步**的请求，带 stepCount
        const out = [];
        for (const r of REQUESTS) {
          const last = out[out.length - 1];
          if (last && last.turn === r.turn) out[out.length - 1] = { ...r, stepCount: (last.stepCount || 1) + 1 };
          else out.push({ ...r, stepCount: 1 });
        }
        return out;
      })()
    : REQUESTS;
  const parts = list.map((r, i) => barParts(r, i > 0 ? list[i - 1] : null));
  const series = parts.map((p) => CATS.reduce((sum, c) => sum + (p[c.key] || 0), 0));
  return { list, series, parts };
}
/** 可见范围（自适应刻度只按眼前这几根算）。 */
function visibleRange(n, scrollEl) {
  if (!S.trendAdaptive || !scrollEl) return [0, n - 1];
  const bw = BAR_W + BAR_GAP;
  const i0 = Math.max(0, Math.floor(scrollEl.scrollLeft / bw) - 1);
  const i1 = Math.min(n - 1, Math.ceil((scrollEl.scrollLeft + scrollEl.clientWidth) / bw) + 1);
  return [i0, i1];
}
/**
 * 刻度：返回整柱上限与零线上下限。
 * 增量模式下零线按 maxUp : maxDown **成比例**分割柱区（参考插件原文：
 * "The zero line splits the bar area PROPORTIONALLY to the larger side, so the px-per-token scale is
 * identical above and below it — a compaction's downward bar reads honestly against a growth bar."），
 * 于是"向下那截"和"向上那截"每一像素代表的量是一样的，不会骗人。
 */
function chartScale(parts, scrollEl) {
  const [i0, i1] = visibleRange(parts.length, scrollEl || null);
  let maxTotal = 1, maxUp = 1, maxDown = 1;
  for (let i = i0; i <= i1; i++) {
    const p = parts[i] || {};
    let up = 0, down = 0;
    for (const c of CATS) {
      const v = p[c.key] || 0;
      if (v >= 0) up += v; else down += -v;
    }
    maxTotal = Math.max(maxTotal, up + down);
    maxUp = Math.max(maxUp, up);
    maxDown = Math.max(maxDown, down);
  }
  const span = Math.max(1, maxUp + maxDown);
  const deltaScale = CHART_H / span;
  const upPx = Math.round(maxUp * deltaScale);
  return { maxTotal, maxUp, maxDown, deltaScale, upPx, downPx: CHART_H - upPx };
}
const visibleMax = (series, scrollEl) => (S.trendMode === 'delta'
  ? chartScale(window.__trendParts || [], scrollEl).maxUp
  : chartScale(window.__trendParts || [], scrollEl).maxTotal);
function applyTrendScale() {
  const sc = $('trendScroll');
  if (!sc) return;
  const parts = (window.__trendParts || []);
  const sc0 = chartScale(parts, sc);
  const delta = S.trendMode === 'delta';
  const prevMax = sc.dataset.max;              // 用于判断"刻度上限有没有变"（变了才刷自测面板）
  // 轴标签：增量模式下要显式给出零线上下的量（不再用"红色 = 负"这种讲不清的表达）
  const top = $('trendAxisTop'), mid = $('trendAxisMid'), bot = $('trendAxisBottom');
  if (top) top.textContent = fmt(delta ? sc0.maxUp : sc0.maxTotal);
  if (mid) mid.textContent = delta ? '' : fmt(sc0.maxTotal / 2);
  if (bot) bot.textContent = delta ? '-' + fmt(sc0.maxDown) : '0';
  const inline = $('trendAxisTopInline');
  if (inline) inline.textContent = fmt(delta ? sc0.maxUp : sc0.maxTotal);
  const zero = sc.querySelector ? sc.querySelector('.zeroline') : null;
  if (zero) zero.style.bottom = sc0.downPx + 'px';
  const totalScale = CHART_H / Math.max(1, sc0.maxTotal);
  const segH = (v, scale) => Math.max(1, Math.round(Math.abs(v) * scale)) + 'px';
  sc.querySelectorAll('.tbar').forEach((el, i) => {
    const p = parts[i] || {};
    if (delta) {
      // 增量：两臂分别锚在零线下方/上方，段高按同一 px/量 比例（参考插件 deltaScale 的语义）
      const up = el.querySelector ? el.querySelector('.arm-up') : null;
      const down = el.querySelector ? el.querySelector('.arm-down') : null;
      if (up) { up.style.bottom = sc0.downPx + 'px'; up.querySelectorAll('.cseg').forEach((sg) => { sg.style.height = segH(p[sg.dataset.cat], sc0.deltaScale); }); }
      if (down) { down.style.top = sc0.upPx + 'px'; down.querySelectorAll('.cseg').forEach((sg) => { sg.style.height = segH(p[sg.dataset.cat], sc0.deltaScale); }); }
    } else {
      el.querySelectorAll('.cseg').forEach((sg) => { sg.style.height = segH(p[sg.dataset.cat], totalScale); });
    }
  });
  sc.dataset.max = String(delta ? sc0.maxUp : sc0.maxTotal);
  /* 刻度上限也是自测面板上的一个读数。面板已经开着时，这里要把它刷新掉 ——
   * 否则面板会一直留着"这个节点刚被重建、还没算过刻度"的那一帧（实测显示 undefined）。 */
  if (prevMax !== sc.dataset.max && S.selfcheck) renderSelfcheck();
}
/* ---------- 趋势图的 hover 提示（照参考插件的 2 行式自绘 tooltip）----------
 * 文案照抄参考插件 i18n：
 *   按步骤：第 {t} 轮 · 第 {s} 步 (共 {n} 步) ／ 按轮次：第 {t} 轮 · 共 {n} 步
 *   第二行：合计 ≈ {n} ／ {类} ≈ {n}（聚焦时）／ Δ {n}（增量模式）
 * 关键：tip 挂在**滚动容器外面**，用 transform 夹在可视区内；pointer-events:none。 */
function trendTipRows(req, i, series) {
  const n = turnSteps(req.turn);
  const head = S.trendGran === 'turn'
    ? (n > 1 ? `第 ${req.turn} 轮 · 共 ${n} 步` : `第 ${req.turn} 轮 · 共 1 步`)
    : `第 ${req.turn} 轮 · 第 ${req.step} 步 (共 ${n} 步)`;
  const v = series[i] || 0;
  const metric = S.trendMode === 'delta'
    ? `Δ ${v > 0 ? '+' : ''}${fmt(v)}`
    : (S.trendCat ? `${catLabel(S.trendCat)} ≈ ${fmt(Math.abs(v))}` : `合计 ≈ ${fmt(Math.abs(v))}`);
  const rows = [head, metric];
  // 事件行：按步骤时该柱最多一条；按轮次时该轮可能含多条，逐条列出（用户就是靠这行知道 ✂ 是什么）
  for (const ev of markersOfBar(req)) rows.push(`✂ ${KIND_LABEL[ev.kind] || ev.kind}：${ev.label}`);

/** 把 tip 贴到该柱子的**可见切片**上（夹在滚动容器可视范围内，绝不越界） */
function syncTrendTip() {
  const sc = $('trendScroll'), tip = $('trendTip');
  if (!sc || !tip || tip.hidden) return;
  const lw = tip.offsetWidth || 120, cw = sc.clientWidth || 300;
  const half = Math.min(lw / 2, cw / 2);
  const col = (Number(tip.dataset.col) || 0) + (BAR_W / 2);
  const cx = Math.min(Math.max(col - sc.scrollLeft, half), cw - half);
  tip.style.transform = `translate(${Math.round(cx - lw / 2)}px, 0)`;
}

  tip.dataset.col = String(i * (BAR_W + BAR_GAP));

    for (const d of edits) carryLines.push(`【改过 · ${d.cat || ''}${d.name ? ' · ' + d.name : ''} · #${d.seq}】\n${d.text}`);
    for (const n of notes) carryLines.push(`【更正 · ${n.where}】\n${n.text}`);
    const carry = carryLines.length
      ? '[redline] 以下是本次改动（以此为准；与此冲突的此前理解一律作废）\n' + carryLines.join('\n\n') + '\n---\n'
      : '';
    confirmModal({
      title: '开启子会话',
      warn: '会新建一个会话，把这个会话「已经聊完的内容」当作它的开头；你保存的改动会逐字写进它的第一句话。之后本会话的新轮次不会进去。',
      rows: [['① 从哪儿开始', `本会话「最后聊完的那一轮」为止（第 ${last.turn} 轮末）—— 平台自己算的，改不了；没有"从更早的位置开始"这个选项`],
             ['② 会写进去的改动', carryLines.length
               ? `${edits.length} 条改写 + ${notes.length} 条更正 —— 逐字拼在它的第一句话前面（当前会话看不到，只有那个新会话的模型读到）`
               : '（你还没保存过任何改动 —— 保存只存本地，开子会话时才写进去）'],
             ['③ 首条任务', '（写在下面那一栏 —— 必须你写；插件不生成任何内容）'],
             ['④ 不会带上', '这个会话的工具授权；本会话此后新聊的内容。'],
             ['⑤ 取消', '取消 = 什么都不发生（不建会话）']],
      needReason: true, okText: '确认创建',
      reasonLabel: '首条任务（会成为子会话的第一句话 —— 它的模型看得到；本会话的模型看不到）',
      reasonPlaceholder: '一句话说清这次要它干什么',
      onOk: (reason) => {
        const id = '00' + (49000 + S.children.length * 771).toString(16).slice(0, 6);
        S.children.push({ id, src: 'own', state: 'running', label: reason.slice(0, 24), prime: carry + reason, norms: edits.length + notes.length });
        render();
        toast(carryLines.length
          ? `已创建 ${id}：${edits.length} 条改写 + ${notes.length} 条更正已逐字写进它的第一句话`
          : `已创建 ${id}（来源 = 本项目发起）`);
      }
    }); return;
  }
}

/* ------------------------------------------------------------------ 10. 讲解模式 */
/**
 * 讲解模式下要标编号的元素。
 * ⚠️ **同类重复元素只标一个**：趋势柱体（按步骤模式 72 根）与轮次刻度格如果每根都标，
 * 图表会被 100+ 个编号糊满（2026-10-01 实测：#trendScroll 里挂了 102 个编号），
 * 用户的原话是"我以为讲解模式只是加个编号，不会影响原来的样式"。
 * 柱体优先标**当前选中的那根**（用户正看着哪根，编号就落在哪根上）；刻度格标第一格。
 */
/**
 * 编号规则（2026-10-01 两次实测后才定下来的）：
 *   ① **连续**：取当前页面上"真实存在的类别"，按讲解词典里的先后顺序排好，依次编 1..N。
 *      —— 不能直接用"词典序号"当编号：那会留下空号（用户问"13、15、16、17…在哪里？"）。
 *   ② **稳定**：顺序由**类别**决定，不由"第几个出现"决定 ——
 *      按出现顺序现数的话，切按轮次/按步骤时前面的元素个数会变（步骤模式多一个 ✂ 标记、
 *      轮次模式的刻度格又没有 data-explain），实测"点轮次时第 1 步是 18、点按步骤时变成 20"。
 *   ③ 同类元素共用一个编号、只标一个（见 explainTargets）。
 */
const EXPLAIN_ORDER = Object.keys(EXPLAIN);
/** 当前页面上存在的类别 → 1..N 的编号（顺序 = 讲解词典顺序）。 */
function explainNumbering(nodes) {
  const present = [...new Set(nodes.map((el) => el.dataset.explain))]
    .filter((k) => EXPLAIN_ORDER.includes(k))
    .sort((a, b) => EXPLAIN_ORDER.indexOf(a) - EXPLAIN_ORDER.indexOf(b));
  return new Map(present.map((k, i) => [k, i + 1]));
}
function explainTargets() {
  const all = [...document.querySelectorAll('[data-explain]')];
  // 趋势区里同类元素成百上千（72 根柱、28 格刻度、若干 ✂），那里**每类只标一个**：
  // 全标的话图表会被编号糊满（实测 102 个）。区外元素不重复标。
  const chart = [...document.querySelectorAll('#trendScroll [data-explain]')];
  if (!chart.length) return all;
  const pickBy = (cls) => {
    const els = chart.filter((el) => el.classList && el.classList.contains(cls));
    return els.find((el) => el.classList.contains('sel')) || els[0];
  };
  const keep = new Set();
  for (const cls of ['tbar', 'tcell', 'mark']) { const el = pickBy(cls); if (el) keep.add(el); }
  // 通用规则（docs/03 §7）：**同类重复元素只标一个编号** —— 柱体标选中的那根、其余同类标第一个。
  const seen = new Set();
  return all.filter((el) => {
    if (chart.includes(el) && !keep.has(el)) return false;
    const k = el.dataset.explain;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function applyExplain() {
  document.body.classList.toggle('explain', S.explain);
  // 每次渲染都重建序号：先清旧的，避免残留（DOM 会被 render() 整体替换）
  document.querySelectorAll('.exnum').forEach((el) => el.remove());
  document.querySelectorAll('.explain-num').forEach((el) => el.classList.remove('explain-num'));
  const nodes = explainTargets();
  let bar = document.querySelector('.explainbar');

  if (S.explain) {
    const numbering = explainNumbering(nodes);
    nodes.forEach((el) => {
      const no = numbering.get(el.dataset.explain);
      el.dataset.exnum = String(no);
      /**
       * ⚠️ 关键：讲解的触达点是**这个序号本身**，不是被讲解的元素。
       * 用真实节点（不是 ::after 伪元素，伪元素点不到）—— 于是：
       *   · 点序号 → 看它是做什么的
       *   · 点按钮本身 → 照常走它自己的交互（不被拦截）
       * 之前我在捕获阶段拦了所有 [data-explain] 的点击，导致开着讲解模式就没法试按钮、只能刷新。
       */
      /* ⚠️ `select`/`input`/`textarea`/`img` **装不下子节点**：塞进去的 <span> 会被浏览器直接丢掉，
       *    于是"编号根本看不见"（用户 2026-10-01 问"11 编号在哪里？"就是 <select> 上的那个）。
       *    这类元素把编号挂到**父节点**上。 */
      const canHost = !['select', 'input', 'textarea', 'img', 'br', 'hr'].includes(String(el.tagName || '').toLowerCase());
      const host = canHost ? el : (el.parentElement || el);
      host.classList.add('explain-num');   // 高亮（::after 虚线环）只跟着有编号的元素走
      const badge = document.createElement('span');
      badge.className = 'exnum' + (el.closest && el.closest('.trendscroll') ? ' exnum-in' : '');
      badge.textContent = String(no);
      badge.setAttribute('role', 'button');
      badge.setAttribute('tabindex', '0');
      badge.setAttribute('title', `#${no} ${(EXPLAIN[el.dataset.explain] || {}).t || ''} —— 点这里看说明（不影响按钮本身）`);
      const show = (e) => {
        e.preventDefault();
        e.stopPropagation();          // 只吃掉这一次点击，别让它触发按钮自身
        openDrawer(el.dataset.explain);
      };
      badge.addEventListener('click', show);
      badge.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') show(e); });
      host.appendChild(badge);
    });
    if (!bar) { bar = document.createElement('div'); bar.className = 'explainbar'; document.body.appendChild(bar); }
        bar.innerHTML = `讲解模式已开：共 <b>${nodes.length}</b> 个序号 · 点<b>左上角序号</b>看它是做什么的；<b>按钮本身照常可用</b>（<span class="muted">Esc 关闭面板</span>）<span class="muted"> · 同类元素共用一个编号、只标一个</span>`;
  } else if (bar) bar.remove();
}

/** 用户 2026-10-02 的减法：把点名要去掉的交互从界面上摘掉（真实现里不生成这些按钮）。 */
function render() {
  applyTheme();

   * 在 demo 层把下面这些交互**从界面上摘掉**（真实现里它们根本不会生成）：
   *   · 固定块（不变量）整卡 + 行上的「钉住这一段」
   *   · 官方团队整块 + 「派活」「建成官方任务」「去官方面板」
   *   · 子会话行上的「打开」「发消息」
   * 保留：整体布局、轮次/趋势/事件卡、浏览器的编辑/批注、版本历史、开启子会话、压缩、打断。 */
  renderSwitches(); renderNotice();
  renderStats(); renderTrend(); renderStep(); renderEvents();
  renderBrowser();
  /* 草稿两步已删除（用户 2026-10-02）：不再有「还有 N 条未生效 / 逐条应用 / 放弃未应用的改动」横幅。 */
  renderOrch(); applyExplain(); renderSelfcheck();   // ⚠️ 必须最后跑：上面那些 render* 会把 HTML 重写一遍
}

/**
 * 主题**跟随系统**（用户 2026-10-01：不要那个切换按钮）。
 * 深色落到 `body[data-ds-dark-theme]` —— 这正是 DSH 自己的深色选择器（docs/03 V2），
 * 所以 demo 与真机上的表现是同一条通道；`?theme=dark|light` 是给验证用的调试钩子。
 */
/** 读 URL 上的调试开关（?dev=1 / ?theme=dark|light）。
 *  用 window.location + try 包住：冒烟测试的 DOM 桩里没有 location，不能让整个页面挂掉。 */
function queryFlag(k) {
  try { return new URLSearchParams((window.location && window.location.search) || '').get(k); }
  catch (e) { return null; }
}
function applyTheme() {
  const forced = queryFlag('theme');
  const dark = forced === 'dark' || (forced !== 'light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  if (dark) document.body.setAttribute('data-ds-dark-theme', '');
  else document.body.removeAttribute('data-ds-dark-theme');
}
{
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', () => { if (!queryFlag('theme')) { applyTheme(); render(); } });
  }
}
$('btnExplain').onclick = () => { S.explain = !S.explain; if (!S.explain) closeDrawer(); $('btnExplain').setAttribute('aria-pressed', String(S.explain)); render(); toast(S.explain ? '讲解模式：点任一高亮元素看说明' : '讲解模式已关'); };
// 自测面板是**自检工具**，不再占顶栏：?dev=1 直接打开（见 demo/README）
if (queryFlag('dev') === '1') S.selfcheck = true;
$('btnReset').onclick = () => { S = initial(); render(); toast('原型已重置'); };
$('drawerClose').onclick = () => closeDrawer();
$('modalCancel').onclick = () => {
  $('modalWrap').hidden = true;
  /* 编辑器「保存」弹出来的那个确认框，取消 = 这次改动不留痕（不再有"未生效"这一档）。 */
  if (S._pendingDraftSeq != null) { delete S.drafts[S._pendingDraftSeq]; S._pendingDraftSeq = null; render(); }
};
// 捕获阶段**只做一件事**：窄屏（遮罩式）时点面板外关闭。
// ⚠️ 绝不再拦截 [data-explain] 的点击 —— 那会让讲解模式把按钮本身的交互全部吃掉。
document.addEventListener('click', (e) => {
  const drawer = $('drawer');
  if (!drawer || drawer.hidden) return;
  const narrow = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 899px)').matches : false;
  const insideDrawer = !!(e.target.closest && e.target.closest('.drawer'));
  if (narrow && !insideDrawer) closeDrawer();
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { S.editor = null; $('modalWrap').hidden = true; closeDrawer(); render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.editor) submitEditor();
  if (!S.editor && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const list = reqsOfTurn(S.selTurn), i = list.findIndex((r) => r.seq === S.selSeq);
    const n = list[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (n) selectReq(n, null);
  }
});
