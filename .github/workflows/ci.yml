name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm

      # Registry install only. This repository never creates a
      # node_modules/@deepseek-ai symlink; the namespace gate asserts it stays a
      # real directory so `pnpm install` cannot write through into a shared profile.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node scripts/check-docs.mjs
      - run: node scripts/namespace-contract.mjs
      - run: node scripts/css-closure.mjs
      - run: node scripts/i18n-orphans.mjs
      - run: node scripts/check-workflows.mjs
      - run: pnpm run build
      - run: pnpm run test
      - run: ./node_modules/.bin/vitest run
      - run: node scripts/check-package.mjs
      - run: node demo/check-static.mjs
      - run: node demo/check-runtime.mjs
      - run: node scripts/check-release-ready.mjs
