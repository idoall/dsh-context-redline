name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      # Registry install only. This repository never creates a
      # node_modules/@deepseek-ai symlink; the namespace gate asserts it stays a
      # real directory so `pnpm install` cannot write through into a shared profile.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node scripts/check-docs.mjs
      - run: node scripts/namespace-contract.mjs
      - run: node scripts/css-closure.mjs
      - run: node scripts/i18n-orphans.mjs
      - run: pnpm run build
      - run: pnpm run test
      - run: ./node_modules/.bin/vitest run
      - run: node demo/check-static.mjs
      - run: node demo/check-runtime.mjs
      - run: node scripts/check-release-ready.mjs
      - run: pnpm run pack:check
