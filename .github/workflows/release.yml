name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Version and bilingual notes gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Require tag to match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Require bilingual release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes" || {
            echo "Missing release notes: $notes" >&2
            exit 1
          }
          grep -q "<h3 id=\"cn-${GITHUB_REF_NAME}\">" "$notes" || {
            echo "$notes has no Chinese section anchor" >&2
            exit 1
          }
          grep -q "<h3 id=\"en-${GITHUB_REF_NAME}\">" "$notes" || {
            echo "$notes has no English section anchor" >&2
            exit 1
          }

  package:
    name: Build and verify package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: ./node_modules/.bin/vitest run
      - run: node scripts/check-docs.mjs
      - run: node scripts/namespace-contract.mjs
      - run: node scripts/css-closure.mjs
      - run: node scripts/i18n-orphans.mjs
      - run: node scripts/check-workflows.mjs
      - run: node scripts/check-release-ready.mjs
      - name: Pack or adopt the immutable npm artifact
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "dsh-context-redline@$version" version 2>/dev/null || true)"
          rm -f dsh-context-redline-*.tgz
          if [ "$published" = "$version" ]; then
            # A published npm version is immutable. Download that exact registry
            # tarball so the GitHub Release cannot attach different bytes under
            # the same package/version identity.
            npm pack "dsh-context-redline@$version" --pack-destination .
          else
            pnpm pack
          fi
          package="$(find . -maxdepth 1 -type f -name 'dsh-context-redline-*.tgz' -print -quit)"
          test -n "$package" && test -f "$package"
          node scripts/check-package.mjs "$package"
          sha256sum "$package" > dsh-context-redline-plugin.sha256
          sha256sum -c dsh-context-redline-plugin.sha256
      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > dsh-context-redline-sbom.cdx.json
          node -e "const s=require('./dsh-context-redline-sbom.cdx.json'); if(s.bomFormat!=='CycloneDX'||s.metadata?.component?.name!=='dsh-context-redline'||s.metadata?.component?.version!==require('./package.json').version) process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: |
            *dsh-context-redline-*.tgz
            dsh-context-redline-plugin.sha256
            dsh-context-redline-sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: package
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-package
          path: release-assets
      - name: Verify artifact checksum
        working-directory: release-assets
        run: sha256sum -c dsh-context-redline-plugin.sha256
      - name: Publish over npm Trusted Publishing
        run: |
          package="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f -name '*dsh-context-redline-*.tgz' -print -quit)"
          test -n "$package"
          version="${GITHUB_REF_NAME#v}"
          published="$(npm view "dsh-context-redline@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "dsh-context-redline@$version is already published; leaving npm unchanged."
            exit 0
          fi
          # Trusted publishing (OIDC): NODE_AUTH_TOKEN is intentionally unset.
          # Provenance is generated here (GitHub Actions is a supported provider);
          # it is deliberately NOT forced in publishConfig, which would break a
          # local `npm publish`.
          npm publish "$package" --access public --provenance

  github-release:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify artifact checksum
        working-directory: release-assets
        run: sha256sum -c dsh-context-redline-plugin.sha256
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes" || { echo "Missing release notes: $notes" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
